<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARCHIVE // ALVIN P.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00d4ff;
            --bg: #030712;
            --glass: rgba(15, 23, 42, 0.8);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0; background: var(--bg); color: white;
            overflow-x: hidden; scroll-behavior: smooth;
        }

        /* CURSOR GLOW EFFECT */
        #glow {
            position: fixed; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(0,212,255,0.1) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%); transition: 0.1s linear;
        }

        /* HEADER */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.15); padding: 15px 0;
        }

        .nav-container {
            max-width: 1200px; margin: 0 auto; display: flex;
            justify-content: space-between; align-items: center; padding: 0 25px;
        }

        .logo { font-weight: 900; letter-spacing: 4px; color: var(--neon); font-size: 1.4em; }

        .ai-wrapper { position: relative; width: 40%; }
        .ai-input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 12px 25px; border-radius: 50px; color: white; outline: none; transition: 0.3s;
        }
        .ai-input:focus { border-color: var(--neon); box-shadow: 0 0 20px rgba(0, 212, 255, 0.3); }

        #ai-bubble {
            position: absolute; top: 60px; left: 0; width: 100%;
            background: #0f172a; border: 1px solid var(--neon);
            border-radius: 15px; padding: 20px; display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); z-index: 2000;
        }

        /* HERO & CONTENT */
        section { padding: 150px 20px 50px; max-width: 1100px; margin: 0 auto; }
        .hero { text-align: center; }
        .hero h1 { font-size: 4em; font-weight: 900; margin: 0; letter-spacing: -2px; }

        .music-card {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px; padding: 25px; margin: 40px 0;
            display: flex; align-items: center; gap: 25px;
            transition: 0.3s;
        }
        .music-card:hover { border-color: var(--neon); transform: scale(1.02); }
        .art { width: 120px; height: 120px; background: #1e293b; border-radius: 12px; flex-shrink: 0; overflow: hidden; }

        /* GRID CATALOG */
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px; margin-top: 50px;
        }
        .card {
            background: var(--glass); border-radius: 15px; padding: 15px;
            border: 1px solid rgba(255,255,255,0.03); transition: 0.3s;
        }
        .card:hover { border-color: var(--neon); transform: translateY(-5px); }
        .cover { width: 100%; height: 220px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; }

        footer { text-align: center; padding: 80px; opacity: 0.3; font-size: 0.7em; letter-spacing: 4px; }

        .shimmer { height: 15px; background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: load 1.5s infinite; }
        @keyframes load { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

<div id="glow"></div>

<header>
    <div class="nav-container">
        <div class="logo">ARCHIVE</div>
        <div class="ai-wrapper">
            <input type="text" id="aiInput" class="ai-input" placeholder="Tanya AI (Tekan Enter)...">
            <div id="ai-bubble"></div>
        </div>
    </div>
</header>

<section class="hero">
    <h1>CYBER ARCHIVE</h1>
    <p style="opacity: 0.6;">Alvin Phanestu // Personal Digital Archive & Studio</p>
    
    <div class="music-card">
        <div class="art"><img src="https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=400" style="width:100%; height:100%; object-fit:cover;"></div>
        <div style="text-align: left;">
            <div style="color: var(--neon); font-size: 0.8em; font-weight: 800;">CURRENT PROJECT</div>
            <h2 style="margin: 5px 0;">Mini Album 2026</h2>
            <p style="opacity: 0.5; font-size: 0.9em; margin: 0;">Mixing & Mastering phase. Indie-pop vibes.</p>
        </div>
    </div>

    <div class="grid" id="mainGrid"></div>
</section>

<footer>PRODUCED BY ALVIN PHANESTU // 2026</footer>

<script>
    // --- INTEGRASI API KEY LO ---
    const API_KEY = "AIzaSyBC8-h450CojUbAMjNSrt9u7Tfh0jEkEAk"; 

    // Cursor Glow
    const glow = document.getElementById('glow');
    document.addEventListener('mousemove', (e) => {
        glow.style.left = e.clientX + 'px';
        glow.style.top = e.clientY + 'px';
    });

    // Data Library
    const data = [
        { title: "One OK Rock Collection", auth: "Taka & Co", img: "https://images.unsplash.com/photo-1493225255756-d9584f8606e9?w=400" },
        { title: "Accounting Logs", auth: "Admin Archive", img: "https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=400" },
        { title: "Indie Pop Aesthetics", auth: "Hindia Inspired", img: "https://images.unsplash.com/photo-1514525253361-bee8718a300a?w=400" },
        { title: "Digital Snack Hub", auth: "Tersnacks ID", img: "https://images.unsplash.com/photo-1551288049-bbbda536ad79?w=400" }
    ];

    const grid = document.getElementById('mainGrid');
    data.forEach(item => {
        grid.innerHTML += `
            <div class="card">
                <img src="${item.img}" class="cover">
                <div style="font-weight:700; color:var(--neon)">${item.title}</div>
                <div style="font-size:0.8em; opacity:0.5">${item.auth}</div>
            </div>
        `;
    });

    // AI GEMINI CORE
    const aiInput = document.getElementById('aiInput');
    const aiBubble = document.getElementById('ai-bubble');

    aiInput.addEventListener('keypress', async (e) => {
        if(e.key === 'Enter') {
            const prompt = aiInput.value;
            if(!prompt) return;

            aiBubble.style.display = 'block';
            aiBubble.innerHTML = '<div class="shimmer"></div>';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Kamu adalah asisten perpustakaan digital Alvin bernama ArchiveAI. Jawab dengan sangat singkat, gaul, dan solutif: ${prompt}` }]}]
                    })
                });

                const json = await response.json();
                const output = json.candidates[0].content.parts[0].text;
                aiBubble.innerHTML = `<b style="color:var(--neon)">ArchiveAI:</b><br>${output}`;
            } catch (err) {
                aiBubble.innerHTML = `<span style="color:red">Gagal konek ke Gemini. Cek kuota atau key lo, Vin!</span>`;
            }
        }
    });

    document.addEventListener('mousedown', (e) => {
        if(!e.target.closest('.ai-wrapper')) aiBubble.style.display = 'none';
    });
</script>

</body>
</html>
