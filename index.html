<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINGULARITY // CORE OPS V.PS2</title>
    <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff0000; --glow: rgba(255, 0, 0, 0.4); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Syncopate', sans-serif; overflow: hidden; height: 100vh; }
        
        /* UI OVERLAY */
        #ui { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); transition: 0.5s; backdrop-filter: blur(5px); }
        #score { position: fixed; top: 20px; left: 20px; font-size: 1.2rem; color: #fff; text-shadow: 0 0 10px var(--accent); z-index: 50; display: none; }
        
        button { background: none; border: 2px solid var(--accent); color: var(--accent); padding: 15px 40px; font-family: 'Syncopate'; cursor: pointer; transition: 0.3s; letter-spacing: 5px; text-transform: uppercase; }
        button:hover { background: var(--accent); color: #000; box-shadow: 0 0 30px var(--accent); }
        
        #game-over { position: fixed; inset: 0; background: rgba(255,0,0,0.2); display: none; z-index: 101; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        
        /* Loading Bar Estetik */
        .load-bar { width: 200px; height: 1px; background: #333; margin-top: 20px; overflow: hidden; position: relative; }
        .load-progress { position: absolute; height: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent); width: 0%; transition: 0.2s; }
    </style>
</head>
<body>

<div id="score">SCORE: 000</div>

<div id="ui">
    <h1 style="margin-bottom: 20px; letter-spacing: 15px; font-size: 2.5rem; text-shadow: 0 0 20px var(--accent);">SINGULARITY</h1>
    <p style="margin-bottom: 40px; font-size: 0.65rem; opacity: 0.5; letter-spacing: 3px;">DEPLOY CORE PROTOCOL: [A] [D] OR [<-] [->]</p>
    <button id="startBtn" onclick="startGame()" style="display:none;">INITIALIZE CORE</button>
    <div class="load-bar" id="loadBar"><div class="load-progress" id="bar"></div></div>
</div>

<div id="game-over">
    <h1 style="font-size: 3rem; margin-bottom: 20px; color:#fff; text-shadow:0 0 20px var(--accent);">CORE BREACH</h1>
    <button onclick="location.reload()">REBOOT SYSTEM</button>
</div>

<audio id="bgm" src="chaosmyth.mp3" loop preload="auto"></audio>

<script>
    let scene, camera, renderer, player, grid, obstacles = [], score = 0, isGaming = false;
    let spawnRate = 900;
    let gameSpeed = 1.3;
    const audio = document.getElementById('bgm');
    const startBtn = document.getElementById('startBtn');
    const loadBar = document.getElementById('loadBar');
    const bar = document.getElementById('bar');

    // MOCK LOADING SYSTEM (BIAR AFDOL)
    let progress = 0;
    const interval = setInterval(() => {
        progress += Math.random() * 20;
        bar.style.width = Math.min(progress, 100) + "%";
        if(progress >= 100) {
            clearInterval(interval);
            loadBar.style.display = 'none';
            startBtn.style.display = 'block';
        }
    }, 250);

    function init() {
        // 1. SETUP SCENE & CAMERA (TINGKAT DEWA)
        scene = new THREE.Scene();
        // Trik PS2: Kabut biar estetik dan rintangan muncul halus
        scene.fog = new THREE.FogExp2(0x000000, 0.015);
        
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Biar gak terlalu berat
        document.body.appendChild(renderer.domElement);

        // 2. GRID VISUAL (Dewa Level)
        grid = new THREE.GridHelper(500, 100, 0xff0000, 0x330000);
        grid.position.y = -1;
        grid.position.z = -200;
        scene.add(grid);

        // 3. LIGHTING (Kunci Grafik PS2)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const pointLight = new THREE.PointLight(0xff0000, 2, 100);
        pointLight.position.set(0, 5, 5);
        scene.add(pointLight);

        // 4. PLAYER SHIP (SOLID LOW-POLY)
        const playerGeo = new THREE.ConeGeometry(0.8, 2.5, 4);
        const playerMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            emissive: 0x222222,
            roughness: 0.5,
            metalness: 0.5
        });
        player = new THREE.Mesh(playerGeo, playerMat);
        player.rotation.x = Math.PI / 2;
        player.position.y = 0.5;
        scene.add(player);

        camera.position.set(0, 4, 10);
        camera.lookAt(0, 1, -10);

        // 5. CONTROLS (GSAP SMOOTH)
        const move = (targetX) => {
            gsap.to(player.position, {x: targetX, duration: 0.25, ease: "power2.out"});
            gsap.to(player.rotation, {z: (targetX / -2) * 0.4, duration: 0.2}); // Miringin kapal dikit
            gsap.to(pointLight.position, {x: targetX, duration: 0.25});
        };

        window.addEventListener('keydown', (e) => {
            if(!isGaming) return;
            if(e.key === 'a' || e.key === 'ArrowLeft') move(-2.5);
            if(e.key === 'd' || e.key === 'ArrowRight') move(2.5);
        });
        
        // Reset rotation pas tombol dilepas
        window.addEventListener('keyup', (e) => {
            if(!isGaming) return;
            gsap.to(player.rotation, {z: 0, duration: 0.1});
        });
    }

    function spawnObstacle() {
        if(!isGaming) return;
        
        // Tipe Rintangan: Balok Solid
        const geo = new THREE.BoxGeometry(1.8, 1.8, 1.8);
        const mat = new THREE.MeshPhongMaterial({ 
            color: 0xee0000, 
            shininess: 30,
            specular: 0x555555
        });
        const obs = new THREE.Mesh(geo, mat);
        
        obs.position.set(Math.random() > 0.5 ? 2.5 : -2.5, 0.5, -150);
        obs.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0); // Rotasi acak
        scene.add(obs);
        obstacles.push(obs);
        
        // Dynamic Difficulty
        if(spawnRate > 500) spawnRate -= 5;
        gameSpeed += 0.005;

        setTimeout(spawnObstacle, spawnRate);
    }

    function startGame() {
        isGaming = true;
        document.getElementById('ui').style.display = 'none';
        document.getElementById('score').style.display = 'block';
        audio.play().catch(e => console.log("Check audio file!"));
        
        init();
        spawnObstacle();
        animate();
    }

    function animate() {
        if(!isGaming) return;
        requestAnimationFrame(animate);

        // Gerakan Obstacles & Grid
        grid.position.z += gameSpeed;
        if(grid.position.z > 0) grid.position.z = -200; // Reset Grid loop

        obstacles.forEach((obs, index) => {
            obs.position.z += gameSpeed;
            obs.rotation.y += 0.02; // Muter pelan baloknya

            // Collision Detection (PS2 Pro)
            if(obs.position.z > player.position.z - 1.5 && obs.position.z < player.position.z + 1.5) {
                if(Math.abs(obs.position.x - player.position.x) < 1.2) {
                    endGame();
                }
            }

            // Clean up
            if(obs.position.z > 20) {
                scene.remove(obs);
                obstacles.splice(index, 1);
                score += 10;
                document.getElementById('score').innerText = `SCORE: ${String(score).padStart(3, '0')}`;
            }
        });

        renderer.render(scene, camera);
    }

    function endGame() {
        isGaming = false;
        audio.pause();
        // Efek mati gempa dikit
        gsap.to(camera.position, {y: 10, z: 20, duration: 1, ease: "elastic.out"});
        
        setTimeout(() => {
            document.getElementById('game-over').style.display = 'flex';
        }, 800);
    }

    window.addEventListener('resize', () => {
        if(camera) {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    });
</script>
</body>
</html>
