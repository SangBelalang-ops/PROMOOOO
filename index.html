<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETOX-X // THE SINGULARITY</title>
    
    <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">

    <style>
        :root { --accent: #ff0000; --glow: rgba(255, 0, 0, 0.6); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        
        /* PRELOADER LEVEL DEWA */
        #loader {
            position: fixed; inset: 0; z-index: 1000; background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .load-bar { width: 200px; height: 2px; background: #222; margin-top: 20px; position: relative; }
        .load-progress { position: absolute; height: 100%; width: 0%; background: var(--accent); box-shadow: 0 0 15px var(--accent); }

        #canvas-container { position: fixed; inset: 0; z-index: 1; filter: contrast(1.2) brightness(0.8); }

        /* LYRIC ENGINE V3 (SCROLL STYLE) */
        .lyrics-wrapper {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; height: 300px; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
            mask-image: linear-gradient(to bottom, transparent, black 40%, black 60%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 40%, black 60%, transparent);
        }
        #lyric-track { transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1); text-align: center; }
        .lyric-line {
            font-family: 'Syncopate'; font-size: clamp(0.8rem, 3vw, 2rem);
            margin: 20px 0; opacity: 0.2; transition: 0.5s; text-transform: uppercase;
            letter-spacing: 2px;
        }
        .lyric-line.active { opacity: 1; color: #fff; text-shadow: 0 0 20px var(--accent); transform: scale(1.1); }

        .hud { position: fixed; bottom: 40px; left: 40px; z-index: 20; border-left: 2px solid var(--accent); padding-left: 20px; }
        .hud h3 { font-family: 'Syncopate'; font-size: 0.7rem; color: var(--accent); letter-spacing: 5px; }
    </style>
</head>
<body>

<div id="loader">
    <h1 style="font-family:'Syncopate'; font-size:0.8rem; letter-spacing:10px;">INITIALIZING ARCHIVE</h1>
    <div class="load-bar"><div class="load-progress" id="bar"></div></div>
</div>

<div id="canvas-container"></div>

<div class="lyrics-wrapper">
    <div id="lyric-track"></div>
</div>

<div class="hud">
    <p style="font-size: 0.5rem; opacity: 0.4; margin-bottom: 5px;">PROTOCOL: ONE OK ROCK</p>
    <h3 id="song-title">CORE STANDBY</h3>
</div>

<audio id="audio-player"></audio>

<script>
    // FULL LIRIK TANPA POTONGAN
    const setlist = [
        {
            title: "C.H.A.O.S.M.Y.T.H",
            file: "chaosmyth.mp3",
            lyrics: [
                "Aikawarazu ano koro ni hanashita", "Yume wo boku wa oi tsuzukete ru yo", "Mou kotoshi kara isogashiku naru yona?", "Demo kawarazu kono basho wa aru kara",
                "So everybody ever be buddies", "Days we grew up are days we will treasure (show)", "Everybody show is begining curtain has risen", "Make your own storyline",
                "Dream as if you will live forever", "And live as if you'll die today", "Fuzake ai tawaimonai", "Kudaranai hanashi wo shite wa", "Nakiwarai nagusame ai",
                "So owaranai uta ima utau yo", "Dream as if you will live forever", "And live as if you'll die today", "Waru-sa ya baka mo shita ne yoku okorareta ne",
                "Tada tanoshikute sonna hibi ga zutto", "Tsuzuku to omotteta", "Kedo kizukeba otona ni nattete", "Sore to tomoni yume mo dekaku natte itte", "Sorezore ga eranda michi e",
                "We have to carry on", "Our lives are going on", "Demo kawarazu ano bashou wa aru kara", "So everybody ever be buddies", "Days we grew up are days We will treasure (show)",
                "Everybody show is begining curtain has risen", "Make your own storyline", "Dream as if you will live forever", "And live as if you'll die today", "Fuzake ai tawaimonai",
                "Kudaranai hanashi wo shite wa", "Nakiwarai nagusame ai", "So owaranai uta ima utau yo", "Dream as if you will live forever", "And live as if you'll die today",
                "We all, we all", "Have unforgettable and precious treasure", "It lasts forever, it lasts forever", "Toki ga tachi oite itte mo", "Kakegae no nai takaromo no wa",
                "Me ni mienu katachi janai", "Taisetsuna memory", "Kore kara saki mo zutto isshou zutto...", "So everybody ever be buddies", "Days we grew up are days we will treasure (show)",
                "Everybody show is beginning curtain has risen", "Make your own storyline", "Dream as if you will live forever", "And live as if you'll die today", "Fuzake ai tawaimonai",
                "Kudaranai hanashi wo shite wa", "Nakiwarai nagusame ai", "So owaranai uta ima utau yo", "Dream as if you will live forever", "And live as if you'll die today"
            ]
        },
        {
            title: "NOBODY'S HOME",
            file: "nobodyhomes.mp3",
            lyrics: [
                "How are you doing?", "Sonna fuu ni ieru no ni mo jikan ga kakatta ne?", "Itsudatte koko dake wa nukumori ya yasashi sa ga", "Boku wo tsutsunde kureteta basho de?",
                "Kedo boku wa nando mo uragitte kita ne?", "I just say kokoro kara I'm sorry", "Ima yatto kizuita yo", "Nobody's home yeah", "Nobody's home yeah",
                "Nanimokamo wo sutete tobidashita ano hi", "Omoi daseba boku no senaka wo", "Ano toki mo tsuyoku oshite kureteta'n da ne", "Kizukeba barabara ni natteta'n da",
                "Dou suru koto mo dekinakute tada kuyashikute?", "Motometeta oya no yume hoshikatta boku no yume", "Majiwaru koto wa nakatta genjitsu", "Kedo ima ieru koto ga aru no",
                "Hanarete mo yuraganai mon wa aru!!", "Nobody's home yeah", "Nobody's home yeah", "Tatoe katachi ga kuzurete nakunatte mo", "Me ni wa mienai mono de kanarazu",
                "Bokura ikiru kagiri tsunagatte iru kara", "Nobody's home yeah", "Nobody's home yeah", "Hontou ni meiwaku bakari kakete kita kara", "Itsuka kanarazu koete kanarazu",
                "Boku no misetai keshiki wo miseru kara", "Nobody's home yeah", "Nobody's home yeah", "Kokoro kara aishiteiru yo arigatou"
            ]
        }
    ];

    let currentTrackIdx = 0;
    const audio = document.getElementById('audio-player');
    const lyricTrack = document.getElementById('lyric-track');

    // MOCK LOADING SYSTEM
    let progress = 0;
    const interval = setInterval(() => {
        progress += Math.random() * 15;
        document.getElementById('bar').style.width = Math.min(progress, 100) + "%";
        if(progress >= 100) {
            clearInterval(interval);
            gsap.to("#loader", { y: "-100%", duration: 1.2, ease: "expo.inOut", onComplete: () => {
                init3D();
                startEngine();
            }});
        }
    }, 200);

    function startEngine() {
        const track = setlist[currentTrackIdx];
        audio.src = track.file;
        document.getElementById('song-title').innerText = track.title;
        
        // Build Lyric Elements
        lyricTrack.innerHTML = '';
        track.lyrics.forEach(text => {
            const div = document.createElement('div');
            div.className = 'lyric-line';
            div.innerText = text;
            lyricTrack.appendChild(div);
        });

        audio.play();
        
        // SYNC LOGIC (Sistem Interval per 4.5 detik untuk lirik panjang)
        let lIdx = 0;
        const lines = document.querySelectorAll('.lyric-line');
        
        const syncLyrics = setInterval(() => {
            if(lIdx < lines.length) {
                lines.forEach(l => l.classList.remove('active'));
                lines[lIdx].classList.add('active');
                const offset = lIdx * -60; // Geser lirik ke atas
                lyricTrack.style.transform = `translateY(${offset}px)`;
                lIdx++;
            }
        }, 4800);

        audio.onended = () => {
            clearInterval(syncLyrics);
            currentTrackIdx++;
            startEngine();
        };
    }

    function init3D() {
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // GRID VISUAL (Dewa Level)
        const grid = new THREE.GridHelper(200, 50, 0xff0000, 0x220000);
        grid.position.y = -20;
        scene.add(grid);

        const geo = new THREE.IcosahedronGeometry(10, 1);
        const mat = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
        const core = new THREE.Mesh(geo, mat);
        scene.add(core);

        camera.position.z = 50;
        camera.position.y = 5;

        function animate() {
            requestAnimationFrame(animate);
            core.rotation.y += 0.01;
            core.rotation.z += 0.005;
            renderer.render(scene, camera);
        }
        animate();
    }
</script>
</body>
</html>
