<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE OOR'S // ARCHIVE-X</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.155.0/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #00f3ff;
            --bg: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- UI LAYER --- */
        .overlay {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 10px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .main-content {
            max-width: 800px;
        }

        .main-content h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(3rem, 10vw, 8rem);
            line-height: 0.9;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 20px;
            pointer-events: auto;
            cursor: default;
        }

        .glitch-text {
            position: relative;
            display: inline-block;
        }

        .main-content p {
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.6;
            border-left: 2px solid var(--accent);
            padding-left: 20px;
        }

        footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            letter-spacing: 3px;
            opacity: 0.4;
        }

        /* --- AI CHAT INTERFACE (MINIMALIST) --- */
        .ai-terminal {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 300px;
            pointer-events: auto;
            z-index: 100;
        }

        .ai-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-bottom: 1px solid var(--accent);
            padding: 10px;
            color: var(--accent);
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: 0.3s;
        }

        .ai-input:focus {
            background: rgba(0, 243, 255, 0.1);
        }

        #ai-response {
            font-size: 0.8rem;
            margin-top: 10px;
            line-height: 1.5;
            color: #ccc;
            min-height: 20px;
        }

        /* --- DECORATIONS --- */
        .scanner-line {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: rgba(0, 243, 255, 0.2);
            z-index: 5;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>

<div class="scanner-line"></div>
<div id="canvas-container"></div>

<div class="overlay">
    <header>
        <div class="logo">ARCHIVE-X</div>
        <div style="font-size: 0.7rem; opacity: 0.5;">STATUS: OPERATIONAL</div>
    </header>

    <div class="main-content">
        <h1 id="hero-title">DIGITAL<br><span style="color: transparent; -webkit-text-stroke: 1px white;">SINGULARITY</span></h1>
        <p>Beyond human perception. <br>Level Maksimal Experimental Interface.</p>
    </div>

    <div class="ai-terminal">
        <input type="text" id="aiInput" class="ai-input" placeholder="COMMAND SYSTEM...">
        <div id="ai-response"></div>
    </div>

    <footer>
        <div>COORDINATES: 40.7128° N, 74.0060° W</div>
        <div>EST. 2026 // SYSTEM V.9.0</div>
    </footer>
</div>

<script>
    /**
     * THREE.JS ENGINE - THE CORE VISUAL
     */
    let scene, camera, renderer, particles;
    const mouse = { x: 0, y: 0 };

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // CREATE NEURAL NETWORK PARTICLES
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        const particleCount = 2000;

        for (let i = 0; i < particleCount; i++) {
            vertices.push(
                Math.random() * 10 - 5,
                Math.random() * 10 - 5,
                Math.random() * 10 - 5
            );
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        
        const material = new THREE.PointsMaterial({
            color: 0x00f3ff,
            size: 0.02,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        particles = new THREE.Points(geometry, material);
        scene.add(particles);

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);

        // Slow Rotation
        particles.rotation.y += 0.001;
        particles.rotation.x += 0.0005;

        // Mouse Reaction
        gsap.to(particles.rotation, {
            x: mouse.y * 0.5,
            y: mouse.x * 0.5,
            duration: 2
        });

        renderer.render(scene, camera);
    }

    // INTERACTION
    window.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) - 0.5;
        mouse.y = (e.clientY / window.innerHeight) - 0.5;
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // GSAP ENTRANCE ANIMATION
    gsap.from("#hero-title", {
        y: 100,
        opacity: 0,
        duration: 2,
        ease: "expo.out",
        delay: 0.5
    });

    // AI SYSTEM INTEGRATION (GEMINI)
    const aiInput = document.getElementById('aiInput');
    const aiResponse = document.getElementById('ai-response');
    const API_KEY = "AIzaSyBC8-h450CojUbAMjNSrt9u7Tfh0jEkEAk";

    aiInput.addEventListener('keypress', async (e) => {
        if(e.key === 'Enter') {
            const val = aiInput.value;
            aiResponse.innerText = "PROCESSING...";
            aiInput.value = "";

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Kamu adalah Archive-X, sebuah entitas digital canggih. Jawab dengan dingin dan teknis: ${val}` }]}] })
                });
                const data = await res.json();
                const text = data.candidates[0].content.parts[0].text;
                
                // Typing effect
                aiResponse.innerText = "";
                let i = 0;
                const type = () => {
                    if (i < text.length) {
                        aiResponse.innerText += text.charAt(i);
                        i++;
                        setTimeout(type, 20);
                    }
                };
                type();
            } catch(e) {
                aiResponse.innerText = "SYSTEM ERROR. REBOOT REQUIRED.";
            }
        }
    });

    init();
</script>

</body>
</html>
