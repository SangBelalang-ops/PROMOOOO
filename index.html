<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINGULARITY AAA // BEYOND THE VOID</title>
    <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff0000; --neon: #00f3ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Orbitron', sans-serif; overflow: hidden; height: 100vh; }
        
        #ui-layer { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, rgba(20,0,0,1) 0%, rgba(0,0,0,1) 100%); transition: 1s cubic-bezier(0.4, 0, 0.2, 1); }
        #score-hud { position: fixed; top: 30px; left: 30px; z-index: 50; display: none; border-left: 4px solid var(--accent); padding-left: 15px; }
        #score-hud span { font-size: 0.6rem; letter-spacing: 3px; opacity: 0.6; display: block; }
        #score-val { font-size: 2rem; color: #fff; text-shadow: 0 0 15px var(--accent); }

        .btn-aaa { 
            background: none; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 20px 60px; 
            font-family: 'Syncopate'; cursor: pointer; transition: 0.5s; letter-spacing: 8px; position: relative; overflow: hidden;
        }
        .btn-aaa:hover { background: #fff; color: #000; box-shadow: 0 0 50px #fff; transform: scale(1.05); }
        
        #game-over { position: fixed; inset: 0; background: #000; display: none; z-index: 101; flex-direction: column; justify-content: center; align-items: center; }
        .vignette { position: fixed; inset: 0; box-shadow: inset 0 0 150px rgba(0,0,0,0.9); pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

<div class="vignette"></div>

<div id="score-hud">
    <span>NEURAL LINK STATUS: ACTIVE</span>
    <div id="score-val">000000</div>
</div>

<div id="ui-layer">
    <h1 style="font-family:'Syncopate'; font-size: 3vw; letter-spacing: 20px; margin-bottom: 10px; text-shadow: 0 0 30px var(--accent);">DETOX</h1>
    <p style="font-size: 0.5rem; letter-spacing: 10px; opacity: 0.4; margin-bottom: 50px;">AAA GRAPHICAL INTERFACE // VERSION 4.0</p>
    <button class="btn-aaa" onclick="initAAA()">LAUNCH ENGINE</button>
</div>

<div id="game-over">
    <h1 style="font-family:'Syncopate'; font-size: 2rem; margin-bottom: 20px; color: var(--accent);">CORE DISCONNECTED</h1>
    <button class="btn-aaa" onclick="location.reload()">RE-SYNC</button>
</div>

<audio id="bgm" src="chaosmyth.mp3" loop></audio>

<script>
    let scene, camera, renderer, player, particles, obstacles = [], score = 0, isGaming = false;
    let clock = new THREE.Clock();
    const audio = document.getElementById('bgm');

    function initAAA() {
        gsap.to("#ui-layer", { opacity: 0, scale: 1.5, duration: 1.5, onComplete: () => {
            document.getElementById('ui-layer').style.display = 'none';
            document.getElementById('score-hud').style.display = 'block';
            setupScene();
            audio.play();
            isGaming = true;
            spawnSystem();
            animate();
        }});
    }

    function setupScene() {
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);
        
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 10);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        // AAA LIGHTING
        const mainLight = new THREE.PointLight(0xff0000, 5, 50);
        mainLight.position.set(0, 5, 5);
        scene.add(mainLight);
        scene.add(new THREE.AmbientLight(0x404040, 0.5));

        // THE SHIP (AAA DESIGN)
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 3), new THREE.MeshStandardMaterial({color: 0x111111, metalness: 1, roughness: 0.2}));
        const wingL = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.05, 1), new THREE.MeshStandardMaterial({color: 0x333333}));
        wingL.position.set(-1, 0, 0.5);
        const wingR = wingL.clone();
        wingR.position.x = 1;
        
        // Engine Glow
        const engine = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.1), new THREE.MeshBasicMaterial({color: 0x00f3ff}));
        engine.position.z = 1.5;
        
        group.add(body, wingL, wingR, engine);
        player = group;
        scene.add(player);

        // STARFIELD PARTICLES
        const pCount = 5000;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);
        for(let i=0; i<pCount*3; i++) pPos[i] = (Math.random() - 0.5) * 1000;
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        particles = new THREE.Points(pGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8}));
        scene.add(particles);

        // GROUND GRID
        const grid = new THREE.GridHelper(500, 50, 0xff0000, 0x110000);
        grid.position.y = -2;
        scene.add(grid);

        window.addEventListener('keydown', (e) => {
            if(e.key === 'a' || e.key === 'ArrowLeft') {
                gsap.to(player.position, {x: -3, duration: 0.4, ease: "power2.out"});
                gsap.to(player.rotation, {z: 0.4, duration: 0.4});
            }
            if(e.key === 'd' || e.key === 'ArrowRight') {
                gsap.to(player.position, {x: 3, duration: 0.4, ease: "power2.out"});
                gsap.to(player.rotation, {z: -0.4, duration: 0.4});
            }
        });
        window.addEventListener('keyup', () => {
            gsap.to(player.rotation, {z: 0, duration: 0.4});
        });
    }

    function spawnSystem() {
        if(!isGaming) return;
        const geo = new THREE.IcosahedronGeometry(1.5, 0);
        const mat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xff0000, emissiveIntensity: 2, wireframe: false });
        const obs = new THREE.Mesh(geo, mat);
        obs.position.set(Math.random() > 0.5 ? 3 : -3, 0, -150);
        scene.add(obs);
        obstacles.push(obs);
        setTimeout(spawnSystem, Math.max(300, 800 - (score/10)));
    }

    function animate() {
        if(!isGaming) return;
        requestAnimationFrame(animate);
        let delta = clock.getElapsedTime();

        // Warp Speed Effect
        particles.position.z += 5;
        if(particles.position.z > 500) particles.position.z = 0;

        // Camera Breath
        camera.position.y = 3 + Math.sin(delta) * 0.1;

        obstacles.forEach((obs, idx) => {
            obs.position.z += 1.5 + (score/1000);
            obs.rotation.x += 0.05;
            
            // Proximity Check
            if(obs.position.z > 7 && obs.position.z < 9) {
                if(Math.abs(obs.position.x - player.position.x) < 1.5) {
                    gameOver();
                }
            }

            if(obs.position.z > 20) {
                scene.remove(obs);
                obstacles.splice(idx, 1);
                score += 50;
                document.getElementById('score-val').innerText = String(score).padStart(6, '0');
            }
        });

        renderer.render(scene, camera);
    }

    function gameOver() {
        isGaming = false;
        audio.pause();
        gsap.to(camera.position, {z: 5, duration: 0.5, ease: "power4.out"});
        document.getElementById('game-over').style.display = 'flex';
    }
</script>
</body>
</html>
