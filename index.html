<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iklan Kilat Produk</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222; /* Background gelap biar iklan kelihatan nyala */
        }

        /* Container Utama Iklan */
        .ad-container {
            width: 300px;
            position: relative;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* LOGO DI ATAS FOTO GIF */
        .logo-top {
            width: 80px;
            margin-bottom: 10px;
        }

        /* Area Foto GIF */
        .image-wrapper {
            position: relative;
            width: 100%;
            height: 300px; /* Sesuaikan tinggi gif lo */
            overflow: hidden;
            border-radius: 4px;
            background-image: url('https://i.postimg.cc/x1yD1PBH/e5f0873b-c76b-4312-88bc-3bd67981a550.gif');
            background-size: cover;
            background-position: center;
        }

        /* Produk yang Fade In/Out di dalam GIF */
        .product-overlay {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .product-overlay.active {
            opacity: 1;
        }

        /* TULISAN PROMO DI UJUNG BAWAH GIF */
        .promo-tag {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 0, 0, 0.85); /* Warna merah transparan */
            color: yellow;
            font-weight: bold;
            padding: 8px;
            font-size: 1.1em;
            text-transform: uppercase;
            animation: blink 1s infinite; /* Efek kedip biar kilat */
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* Info Harga & Nama di Bawah */
        .info {
            padding: 10px 0;
        }

        .price {
            font-size: 24px;
            color: #e44d26;
            font-weight: bold;
            margin: 5px 0;
        }

        .product-name {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="ad-container">
        <img src="https://i.postimg.cc/hGYqktH0/download.png" class="logo-top" alt="Logo">

        <div class="image-wrapper">
            <img id="product-img" class="product-overlay" src="" alt="Product">
            
            <div class="promo-tag">Beli 10 GRATIS 1</div>
        </div>

        <div class="info">
            <div id="p-name" class="product-name">KACANG TOJIN</div>
            <div class="price">3$</div>
        </div>
    </div>

    <script>
        const products = [
            { id: 0, name: "KACANG TOJIN", img: "https://i.postimg.cc/MZbTnf6L/184f7bee-21ba-4477-81c6-c9f7acfb487a.jpg" },
            { id: 1, name: "KETAWA", img: "https://i.postimg.cc/ncFLBVMD/b95988fe-979d-48c6-891c-900e8f3e42f1.jpg" },
            { id: 2, name: "KACANG TING TING", img: "https://i.postimg.cc/hP2trF7k/ab4902a9-b072-4159-8ebb-3fbf45c8fc0b.jpg" },
            { id: 3, name: "MIE LIDI", img: "https://i.postimg.cc/K84vp9Pc/5bb5bc5e-cf70-47c1-86c5-dbd05e0cc616.jpg" },
            { id: 4, name: "MAKARONI", img: "https://i.postimg.cc/9f7XCrgJ/9c04e078-ee93-4550-8310-851e9a34d691.jpg" },
            { id: 5, name: "BASRENG", img: "https://i.postimg.cc/gjYGV4z5/601de701-a9b5-4bbf-8aa6-87b171349a64.jpg" },
            { id: 6, name: "LUMPIA", img: "https://i.postimg.cc/ZYcbbkj9/38611567-5f9f-4899-9d33-cffa77b5e469.jpg" },
            { id: 7, name: "KACANG ARAB", img: "https://i.postimg.cc/sDgV1n09/16ad7cba-62a3-48d4-a52c-25fe2f379b5e.jpg" },
            { id: 8, name: "KACANG MADU", img: "https://i.postimg.cc/sDH3Wpk1/129f1f36-b98b-4f99-bdde-93c543eb32e8.jpg" }
        ];

        let index = 0;
        const imgEl = document.getElementById('product-img');
        const nameEl = document.getElementById('p-name');

        function slide() {
            imgEl.classList.remove('active'); // Fade out
            
            setTimeout(() => {
                imgEl.src = products[index].img;
                nameEl.textContent = products[index].name;
                imgEl.classList.add('active'); // Fade in
                index = (index + 1) % products.length;
            }, 800);
        }

        setInterval(slide, 3000); // Ganti tiap 3 detik
        slide(); // Jalankan pertama kali
    </script>
</body>
</html>
