<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iklan Kilat - Beli 10 Gratis 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #ad-container {
            width: 300px;
            height: 250px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        #logo {
            width: 50px;
            height: 50px;
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
        }

        #product-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            transition: opacity 1s ease-in-out;
        }

        #product-info {
            padding: 10px;
            text-align: center;
        }

        #product-name {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        #product-price {
            color: #e44d26;
            font-weight: bold;
            font-size: 1.1em;
        }

        #promo-text {
            background-color: #ffc107;
            color: black;
            font-weight: bold;
            padding: 5px;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
        }

        .fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="ad-container">
        <img id="logo" src="https://i.postimg.cc/hGYqktH0/download.png" alt="Logo">
        <img id="product-image" src="" alt="Produk">
        <div id="product-info">
            <div id="product-name"></div>
            <div id="product-price">3$</div>
        </div>
        <div id="promo-text">Beli 10 GRATIS 1</div>
    </div>

    <script>
        const products = [
            { id: 0, name: "KACANG TOJIN", stock: 0, img: "https://i.postimg.cc/MZbTnf6L/184f7bee-21ba-4477-81c6-c9f7acfb487a.jpg" },
            { id: 1, name: "KETAWA", stock: 0, img: "https://i.postimg.cc/ncFLBVMD/b95988fe-979d-48c6-891c-900e8f3e42f1.jpg" },
            { id: 2, name: "KACANG TING TING", stock: 0, img: "https://i.postimg.cc/hP2trF7k/ab4902a9-b072-4159-8ebb-3fbf45c8fc0b.jpg" },
            { id: 3, name: "MIE LIDI", stock: 0, img: "https://i.postimg.cc/K84vp9Pc/5bb5bc5e-cf70-47c1-86c5-dbd05e0cc616.jpg" },
            { id: 4, name: "MAKARONI", stock: 0, img: "https://i.postimg.cc/9f7XCrgJ/9c04e078-ee93-4550-8310-851e9a34d691.jpg" },
            { id: 5, name: "BASRENG", stock: 0, img: "https://i.postimg.cc/gjYGV4z5/601de701-a9b5-4bbf-8aa6-87b171349a64.jpg" },
            { id: 6, name: "LUMPIA", stock: 0, img: "https://i.postimg.cc/ZYcbbkj9/38611567-5f9f-4899-9d33-cffa77b5e469.jpg" },
            { id: 7, name: "KACANG ARAB", stock: 0, img: "https://i.postimg.cc/sDgV1n09/16ad7cba-62a3-48d4-a52c-25fe2f379b5e.jpg" },
            { id: 8, name: "KACANG MADU", stock: 0, img: "https://i.postimg.cc/sDH3Wpk1/129f1f36-b98b-4f99-bdde-93c543eb32e8.jpg" }
        ];

        let currentProductIndex = 0;
        const productImage = document.getElementById('product-image');
        const productName = document.getElementById('product-name');

        function showNextProduct() {
            // Fade out
            productImage.classList.add('fade-out');

            setTimeout(() => {
                // Ganti produk setelah fade out selesai
                const currentProduct = products[currentProductIndex];
                productImage.src = currentProduct.img;
                productName.textContent = currentProduct.name;

                // Fade in
                productImage.classList.remove('fade-out');

                // Lanjut ke produk berikutnya
                currentProductIndex = (currentProductIndex + 1) % products.length;
            }, 1000); // Waktu fade out (sama dengan transition di CSS)
        }

        // Tampilkan produk pertama saat halaman dimuat
        showNextProduct();

        // Ganti produk setiap 4 detik (termasuk waktu fade)
        setInterval(showNextProduct, 4000); 
    </script>
</body>
</html>
