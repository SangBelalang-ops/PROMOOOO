<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOXEL-GOD // BEYOND MINECRAFT</title>
    <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00ff88; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Space Mono', monospace; overflow: hidden; }
        
        #ui-overlay { position: fixed; inset: 0; z-index: 100; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #stats { position: fixed; top: 20px; left: 20px; z-index: 50; display: none; font-size: 0.7rem; color: var(--accent); }
        
        .start-btn {
            background: none; border: 1px solid var(--accent); color: var(--accent); padding: 20px 50px;
            font-family: 'Syncopate'; cursor: pointer; transition: 0.4s; letter-spacing: 5px;
            box-shadow: 0 0 15px rgba(0,255,136,0.2);
        }
        .start-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 50px var(--accent); }

        canvas { display: block; }
        .crosshair { position: fixed; top: 50%; left: 50%; width: 20px; height: 20px; border: 1px solid rgba(255,255,255,0.3); transform: translate(-50%, -50%); pointer-events: none; display: none; }
    </style>
</head>
<body>

<div id="stats">CHUNK_RENDER: ACTIVE <br> VOXEL_TYPE: CRYSTAL <br> FPS: 60</div>
<div class="crosshair" id="ch"></div>

<div id="ui-overlay">
    <h1 style="font-family:'Syncopate'; font-size: 3rem; letter-spacing: 20px; margin-bottom: 20px; color: var(--accent);">VOXEL.ENV</h1>
    <p style="opacity: 0.5; margin-bottom: 50px; letter-spacing: 5px;">WORLD GENERATOR V1.0 // ARCHIVE DETOX</p>
    <button class="start-btn" onclick="launchWorld()">GENERATE WORLD</button>
</div>

<audio id="bgm" src="chaosmyth.mp3" loop></audio>

<script>
    let scene, camera, renderer, player, clock, voxels = [], worldSize = 20;
    const audio = document.getElementById('bgm');

    function launchWorld() {
        gsap.to("#ui-overlay", { opacity: 0, duration: 1, onComplete: () => {
            document.getElementById('ui-overlay').style.display = 'none';
            document.getElementById('stats').style.display = 'block';
            document.getElementById('ch').style.display = 'block';
            initEngine();
            audio.play();
            animate();
        }});
    }

    function initEngine() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.05);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // LIGHTING (AAA Level)
        const sun = new THREE.DirectionalLight(0x00ff88, 1.5);
        sun.position.set(50, 100, 50);
        sun.castShadow = true;
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x404040, 0.6));

        // VOXEL GENERATION LOGIC (Minecraft Style)
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        for(let x = -worldSize; x < worldSize; x++) {
            for(let z = -worldSize; z < worldSize; z++) {
                // Perlin Noise-ish Height
                const h = Math.floor(Math.sin(x * 0.2) * Math.cos(z * 0.2) * 3);
                
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0x111111, 
                    roughness: 0.1, 
                    metalness: 0.8,
                    emissive: 0x00ff88,
                    emissiveIntensity: Math.random() * 0.2
                });

                const cube = new THREE.Mesh(boxGeo, mat);
                cube.position.set(x, h, z);
                cube.receiveShadow = true;
                cube.castShadow = true;
                scene.add(cube);
                voxels.push(cube);
            }
        }

        // PLAYER (First Person Simulation)
        player = new THREE.Group();
        player.position.set(0, 5, 10);
        scene.add(player);
        
        clock = new THREE.Clock();

        // CONTROLS
        window.addEventListener('mousemove', (e) => {
            const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
            player.rotation.y = -mouseX * 0.5;
            camera.rotation.x = mouseY * 0.5;
        });

        window.addEventListener('keydown', (e) => {
            const speed = 0.5;
            if(e.key === 'w') player.translateZ(-speed);
            if(e.key === 's') player.translateZ(speed);
            if(e.key === 'a') player.translateX(-speed);
            if(e.key === 'd') player.translateX(speed);
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();

        // Dynamic Environment
        camera.position.copy(player.position);
        camera.rotation.y = player.rotation.y;

        // Voxel "Pulse" Effect
        voxels.forEach((v, i) => {
            if(i % 10 === 0) {
                v.material.emissiveIntensity = Math.sin(time + i) * 0.5 + 0.5;
            }
        });

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
