<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALAXY ARCHIVE // INTERSTELLAR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.155.0/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }
        #canvas-container { position: fixed; top: 0; left: 0; outline: none; }
        
        /* UI HUD */
        .hud {
            position: fixed; top: 40px; left: 40px; z-index: 100; pointer-events: none;
        }
        .hud h1 { font-family: 'Syncopate'; font-size: 1.5rem; letter-spacing: 10px; color: #00f3ff; margin: 0; }
        
        .controls {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; z-index: 100;
        }
        .btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            padding: 15px 30px; border-radius: 50px; color: white; cursor: pointer;
            backdrop-filter: blur(10px); font-family: 'Syncopate'; font-size: 0.7rem;
            transition: 0.3s; letter-spacing: 2px;
        }
        .btn:hover { background: rgba(255,255,255,0.3); border-color: white; }
        .btn.blue { border-color: #00f3ff; color: #00f3ff; }
        .btn.red { border-color: #ff4d4d; color: #ff4d4d; }
        .btn.yellow { border-color: #ffcc00; color: #ffcc00; }

        .info-panel {
            position: fixed; top: 50%; right: 40px; transform: translateY(-50%);
            text-align: right; max-width: 300px; pointer-events: none;
        }
        .info-panel h2 { font-family: 'Syncopate'; font-size: 3rem; margin: 0; text-transform: uppercase; }
        .info-panel p { opacity: 0.5; letter-spacing: 2px; }

        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.1) 50%);
            background-size: 100% 4px; z-index: 10; pointer-events: none;
        }
    </style>
</head>
<body>

<div class="scanline"></div>
<div id="canvas-container"></div>

<div class="hud">
    <h1>MULTIVERSE ARCHIVE</h1>
    <p style="font-size: 0.6rem; opacity: 0.5; letter-spacing: 5px;">SYSTEM STATUS: NAVIGATION ACTIVE</p>
</div>

<div class="info-panel">
    <h2 id="galaxy-name">Deep Space</h2>
    <p id="galaxy-desc">Scanning cosmic coordinates...</p>
</div>

<div class="controls">
    <div class="btn blue" onclick="travelTo('blue')">Cyan Galaxy</div>
    <div class="btn red" onclick="travelTo('red')">Crimson Sector</div>
    <div class="btn yellow" onclick="travelTo('yellow')">Amber Cluster</div>
</div>

<script>
    let scene, camera, renderer, raycaster, mouse;
    const systems = {};

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 10, 30);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // CREATE 3 GALAXIES
        systems.blue = createGalaxy(0x00f3ff, { x: -30, y: 0, z: -20 });
        systems.red = createGalaxy(0xff4d4d, { x: 30, y: 5, z: -40 });
        systems.yellow = createGalaxy(0xffcc00, { x: 0, y: -10, z: -60 });

        // Add ambient particles (stars)
        const starGeo = new THREE.BufferGeometry();
        const starCoords = [];
        for(let i=0; i<5000; i++) {
            starCoords.push((Math.random()-0.5)*1000, (Math.random()-0.5)*1000, (Math.random()-0.5)*1000);
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
        scene.add(new THREE.Points(starGeo, starMat));

        animate();
    }

    function createGalaxy(color, pos) {
        const group = new THREE.Group();
        const particleCount = 4000;
        const geo = new THREE.BufferGeometry();
        const coords = [];
        const colors = [];

        for (let i = 0; i < particleCount; i++) {
            const r = Math.random() * 15;
            const theta = Math.random() * Math.PI * 2;
            const spiral = r * 0.5; // spiral effect
            
            coords.push(
                Math.cos(theta + spiral) * r,
                (Math.random() - 0.5) * 2,
                Math.sin(theta + spiral) * r
            );
        }

        geo.setAttribute('position', new THREE.Float32BufferAttribute(coords, 3));
        const mat = new THREE.PointsMaterial({
            color: color,
            size: 0.05,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const points = new THREE.Points(geo, mat);
        group.add(points);
        group.position.set(pos.x, pos.y, pos.z);
        scene.add(group);
        return group;
    }

    function travelTo(target) {
        const targetPos = systems[target].position;
        const nameDisplay = document.getElementById('galaxy-name');
        const descDisplay = document.getElementById('galaxy-desc');

        // ANIMASI ZOOM CAMERA
        gsap.to(camera.position, {
            x: targetPos.x,
            y: targetPos.y + 2,
            z: targetPos.z + 15,
            duration: 2.5,
            ease: "expo.inOut"
        });

        // UPDATE UI
        if(target === 'blue') {
            nameDisplay.innerText = "Cyan Galaxy";
            nameDisplay.style.color = "#00f3ff";
            descDisplay.innerText = "Home of the Archive AI Core.";
        } else if(target === 'red') {
            nameDisplay.innerText = "Crimson Sector";
            nameDisplay.style.color = "#ff4d4d";
            descDisplay.innerText = "Emergency Data Storage & Music Labs.";
        } else {
            nameDisplay.innerText = "Amber Cluster";
            nameDisplay.style.color = "#ffcc00";
            descDisplay.innerText = "Legacy Records & Experimental Sound.";
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        
        // Putar pelan semua galaksi
        Object.values(systems).forEach(sys => {
            sys.rotation.y += 0.002;
        });

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>
</body>
</html>
