<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE OOR'S // ARCHIVE-DETOX</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.155.0/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">

    <style>
        :root { --accent: #ff0000; --neon: #00f3ff; --bg: #000000; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        #canvas-container { position: fixed; inset: 0; z-index: 1; }

        /* STARTUP SHIELD */
        #startup {
            position: fixed; inset: 0; z-index: 999; background: black;
            display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;
        }
        #startup h2 { font-family: 'Syncopate'; letter-spacing: 10px; font-size: 1.2rem; color: var(--accent); margin-bottom: 10px; }
        #startup p { font-size: 0.6rem; letter-spacing: 4px; opacity: 0.5; }

        /* LYRICS VIEW */
        .lyrics-container {
            position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 85%; pointer-events: none; z-index: 10;
        }
        #current-lyric {
            font-family: 'Syncopate'; font-size: clamp(1rem, 4vw, 3rem);
            font-weight: 700; text-transform: uppercase; line-height: 1.4;
            text-shadow: 0 0 25px var(--accent); opacity: 0;
        }

        /* HUD UI */
        .hud { position: fixed; z-index: 20; pointer-events: none; padding: 30px; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        .top-left { font-family: 'Syncopate'; font-size: 0.8rem; color: var(--neon); letter-spacing: 5px; }
        .bottom-info { border-left: 2px solid var(--accent); padding-left: 20px; }
        .bottom-info h3 { font-family: 'Syncopate'; font-size: 0.9rem; letter-spacing: 3px; color: var(--accent); }
        
        .nav-hint { position: fixed; bottom: 30px; right: 30px; font-size: 0.6rem; opacity: 0.3; letter-spacing: 2px; }

        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(1000%); } }
        .scan { position: fixed; top: 0; width: 100%; height: 2px; background: rgba(255,0,0,0.1); z-index: 5; animation: scanline 8s linear infinite; }
    </style>
</head>
<body>

<div class="scan"></div>

<div id="startup" onclick="startSystem()">
    <h2>[ INITIALIZE DETOX ]</h2>
    <p>CLICK TO DEPLOY ARCHIVE</p>
</div>

<div id="canvas-container"></div>

<div class="hud">
    <div class="top-left">ARCHIVE-X // SYNCED</div>
    <div class="bottom-info">
        <p style="font-size: 0.5rem; opacity: 0.5; margin-bottom: 5px;">CURRENT STREAM:</p>
        <h3 id="song-title">STANDBY</h3>
    </div>
</div>

<div class="lyrics-container">
    <div id="current-lyric">...</div>
</div>

<div class="nav-hint">MOUSE: ROTATE // SCROLL: ZOOM</div>

<audio id="audio-player"></audio>

<script>
    const setlist = [
        {
            title: "C.h.a.o.s.m.y.t.h.",
            file: "chaosmyth.mp3", 
            lyrics: [
                "Dream as if you'll live forever",
                "And live as if you'll die today",
                "Fuzake ai tawaimonai",
                "Kudaranai hanashi wo shite wa",
                "Nakiwarai nagusame ai",
                "So owaranai uta ima utau yo",
                "Kakegae no nai takaromo no wa",
                "Taisetsuna memory",
                "Kore kara saki mo zutto isshou zutto"
            ]
        },
        {
            title: "Nobody's Home",
            file: "nobodyhomes.mp3",
            lyrics: [
                "How are you doing?",
                "Nobody's home yeah",
                "Nanimokamo wo sutete tobidashita ano hi",
                "Ima yatto kizuita yo",
                "Hanarete mo yuraganai mon wa aru!!",
                "Bokura ikiru kagiri tsunagatte iru kara",
                "Itsuka kanarazu koete kanarazu",
                "Kokoro kara aishiteiru yo arigatou"
            ]
        }
    ];

    let scene, camera, renderer, controls, particles, sun, earth, ufo;
    let currentTrack = 0;
    let lyricIdx = 0;
    const audio = document.getElementById('audio-player');
    const lyricEl = document.getElementById('current-lyric');

    function init3D() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
        camera.position.set(0, 20, 100);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // STARFIELD
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<10000; i++) starPos.push((Math.random()-0.5)*1500, (Math.random()-0.5)*1500, (Math.random()-0.5)*1500);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        particles = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 }));
        scene.add(particles);

        // SUN (MATAHARI)
        const sunGeo = new THREE.SphereGeometry(15, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        sun = new THREE.Mesh(sunGeo, sunMat);
        sun.position.set(-100, 0, -200);
        scene.add(sun);

        // EARTH (BUMI)
        const earthGeo = new THREE.SphereGeometry(4, 32, 32);
        const earthMat = new THREE.MeshPhongMaterial({ color: 0x2233ff, emissive: 0x112244 });
        earth = new THREE.Mesh(earthGeo, earthMat);
        scene.add(earth);

        // UFO
        const ufoGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 1, 32), new THREE.MeshPhongMaterial({color: 0x888888}));
        const dome = new THREE.Mesh(new THREE.SphereGeometry(2, 32, 32, 0, 6, 0, 1.5), new THREE.MeshPhongMaterial({color: 0x00f3ff, transparent: true, opacity: 0.6}));
        ufoGroup.add(body, dome);
        ufo = ufoGroup;
        scene.add(ufo);

        scene.add(new THREE.PointLight(0xffffff, 2, 500));
        scene.add(new THREE.AmbientLight(0x404040));

        animate();
    }

    function startSystem() {
        gsap.to("#startup", { opacity: 0, duration: 1.5, onComplete: () => {
            document.getElementById('startup').style.display = 'none';
            init3D();
            playTrack();
        }});
    }

    function playTrack() {
        if(currentTrack >= setlist.length) currentTrack = 0;
        const data = setlist[currentTrack];
        
        audio.src = data.file;
        document.getElementById('song-title').innerText = data.title;
        audio.play().catch(e => console.log("Audio Error"));

        startLyrics(data.lyrics);
        audio.onended = () => { currentTrack++; playTrack(); };
    }

    function startLyrics(lyrics) {
        lyricIdx = 0;
        const show = () => {
            if(lyricIdx >= lyrics.length) lyricIdx = 0;
            gsap.to(lyricEl, { opacity: 0, scale: 0.9, duration: 0.8, onComplete: () => {
                lyricEl.innerText = lyrics[lyricIdx];
                lyricIdx++;
                gsap.to(lyricEl, { opacity: 1, scale: 1, duration: 0.8 });
            }});
        };
        if(window.timer) clearInterval(window.timer);
        show();
        window.timer = setInterval(show, 4500);
    }

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.001;

        if(controls) controls.update();
        if(particles) particles.rotation.y += 0.0002;
        
        // Orbit Bumi
        if(earth) {
            earth.position.x = Math.cos(time * 0.3) * 120 - 100;
            earth.position.z = Math.sin(time * 0.3) * 120 - 200;
            earth.rotation.y += 0.01;
        }

        // UFO Flight
        if(ufo) {
            ufo.position.y = Math.sin(time) * 10 + 20;
            ufo.position.x = Math.sin(time * 0.5) * 100;
            ufo.position.z = Math.cos(time * 0.5) * 100;
            ufo.rotation.y += 0.05;
        }

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        if(camera) {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    });
</script>
</body>
</html>
