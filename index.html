<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iklan Kilat - Beli 10 Gratis 1</title>
    <style>
        /* Mengatur GIF sebagai background utama seluruh halaman */
        body {
            font-family: 'Arial Black', sans-serif; /* Font lebih tebal untuk kesan iklan */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* LINK GIF ANDA SEBAGAI BACKGROUND */
            background-image: url('https://i.postimg.cc/x1yD1PBH/e5f0873b-c76b-4312-88bc-3bd67981a550.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden; /* Mencegah scrollbar */
        }

        /* Overlay gelap agar teks lebih mudah dibaca di atas GIF */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Hitam transparan 50% */
            z-index: 1;
        }

        /* Kontainer Iklan di Tengah */
        #ad-box {
            position: relative;
            z-index: 2; /* Di atas overlay */
            width: 320px;
            background-color: rgba(255, 255, 255, 0.95); /* Putih sedikit transparan */
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 4px solid #ffc107; /* Border kuning emas */
        }

        /* Teks Promo Utama */
        #promo-header {
            background-color: #ffc107;
            color: #000;
            width: 100%;
            text-align: center;
            padding: 10px 0;
            font-size: 1.5em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        /* Area Foto Produk */
        #product-display {
            width: 100%;
            height: 200px;
            position: relative;
            overflow: hidden;
            background-color: #fff;
        }

        #product-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Menjaga proporsi gambar produk */
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 1s ease-in-out; /* Efek Fade */
            opacity: 0; /* Mulai tersembunyi */
        }

        #product-image.active {
            opacity: 1; /* Tampilkan produk aktif */
        }

        /* Informasi Produk */
        #product-info {
            padding: 15px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        #product-name {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 5px;
            height: 1.4em; /* Menjaga tinggi tetap */
            overflow: hidden;
        }

        #product-price {
            font-size: 2em;
            color: #e44d26; /* Warna merah oranye */
            font-weight: bold;
            margin: 5px 0;
        }

        /* Logo Utama di BAWAH Foto (di bawah info produk) */
        #logo-container {
            padding: 10px;
            width: 100%;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            border-top: 1px solid #eee;
        }

        #main-logo {
            max-width: 80px;
            height: auto;
        }

    </style>
</head>
<body>

    <div id="ad-box">
        <h1 id="promo-header">Beli 10 GRATIS 1</h1>
        
        <div id="product-display">
            <img id="product-image" src="" alt="Produk">
        </div>

        <div id="product-info">
            <div id="product-name">Memuat...</div>
            <div id="product-price">3$</div>
        </div>

        <div id="logo-container">
            <img id="main-logo" src="https://i.postimg.cc/hGYqktH0/download.png" alt="Logo Utama">
        </div>
    </div>

    <script>
        const products = [
            { id: 0, name: "KACANG TOJIN", stock: 0, img: "https://i.postimg.cc/MZbTnf6L/184f7bee-21ba-4477-81c6-c9f7acfb487a.jpg" },
            { id: 1, name: "KETAWA", stock: 0, img: "https://i.postimg.cc/ncFLBVMD/b95988fe-979d-48c6-891c-900e8f3e42f1.jpg" },
            { id: 2, name: "KACANG TING TING", stock: 0, img: "https://i.postimg.cc/hP2trF7k/ab4902a9-b072-4159-8ebb-3fbf45c8fc0b.jpg" },
            { id: 3, name: "MIE LIDI", stock: 0, img: "https://i.postimg.cc/K84vp9Pc/5bb5bc5e-cf70-47c1-86c5-dbd05e0cc616.jpg" },
            { id: 4, name: "MAKARONI", stock: 0, img: "https://i.postimg.cc/9f7XCrgJ/9c04e078-ee93-4550-8310-851e9a34d691.jpg" },
            { id: 5, name: "BASRENG", stock: 0, img: "https://i.postimg.cc/gjYGV4z5/601de701-a9b5-4bbf-8aa6-87b171349a64.jpg" },
            { id: 6, name: "LUMPIA", stock: 0, img: "https://i.postimg.cc/ZYcbbkj9/38611567-5f9f-4899-9d33-cffa77b5e469.jpg" },
            { id: 7, name: "KACANG ARAB", stock: 0, img: "https://i.postimg.cc/sDgV1n09/16ad7cba-62a3-48d4-a52c-25fe2f379b5e.jpg" },
            { id: 8, name: "KACANG MADU", stock: 0, img: "https://i.postimg.cc/sDH3Wpk1/129f1f36-b98b-4f99-bdde-93c543eb32e8.jpg" }
        ];

        let currentProductIndex = 0;
        const productImage = document.getElementById('product-image');
        const productName = document.getElementById('product-name');

        function updateProduct() {
            const product = products[currentProductIndex];

            // 1. Mulai Fade Out gambar lama
            productImage.classList.remove('active');

            // 2. Tunggu 1 detik (durasi transisi CSS), lalu ganti sumber dan Fade In
            setTimeout(() => {
                productImage.src = product.img;
                productName.textContent = product.name;
                
                // Mulai Fade In gambar baru
                productImage.classList.add('active');

                // Siapkan indeks untuk produk berikutnya
                currentProductIndex = (currentProductIndex + 1) % products.length;
            }, 1000); 
        }

        // Tampilkan produk pertama segera
        // (Sedikit trik agar tidak ada delay kosong di awal)
        const firstProduct = products[0];
        productImage.src = firstProduct.img;
        productName.textContent = firstProduct.name;
        productImage.classList.add('active');
        currentProductIndex = 1;

        // Jalankan pergantian setiap 4 detik
        setInterval(updateProduct, 4000); 

    </script>
</body>
</html>
