<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARCHIVE | DIGITAL LIBRARY AI</title>
    <style>
        :root {
            --accent: #00d4ff;
            --bg: #050a14;
            --card: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; background: var(--bg); color: white;
            line-height: 1.6;
        }

        /* HEADER */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(5, 10, 20, 0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .nav-container {
            max-width: 1200px; margin: 0 auto; display: flex;
            justify-content: space-between; align-items: center; padding: 15px 20px;
        }

        .logo { font-weight: 900; letter-spacing: 3px; color: var(--accent); font-size: 1.4em; text-transform: uppercase; }

        /* AI SEARCH BOX */
        .ai-search-box { position: relative; width: 40%; }
        .ai-input {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--accent);
            padding: 12px 20px; border-radius: 50px; color: white; outline: none;
            font-size: 0.9em; transition: 0.3s;
        }
        .ai-input:focus { box-shadow: 0 0 20px rgba(0, 212, 255, 0.4); }

        #ai-bubble {
            position: absolute; top: 60px; left: 0; width: 100%;
            background: #0f172a; border: 1px solid var(--accent);
            border-radius: 15px; padding: 20px; display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); z-index: 2000;
        }

        /* HERO */
        .hero {
            padding: 160px 20px 60px; text-align: center;
            background: radial-gradient(circle at top, rgba(0,212,255,0.15) 0%, transparent 60%);
        }
        .hero h1 { font-size: 3em; margin: 0; font-weight: 900; letter-spacing: -1px; }
        .hero p { opacity: 0.6; font-size: 1.1em; }

        /* CATALOG */
        .catalog {
            max-width: 1100px; margin: 0 auto; padding: 40px 20px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
        }

        .book-card {
            background: var(--card); border-radius: 15px; padding: 15px;
            border: 1px solid rgba(255,255,255,0.05); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .book-card:hover { transform: translateY(-10px); border-color: var(--accent); background: rgba(0,212,255,0.05); }

        .cover {
            width: 100%; height: 280px; object-fit: cover; border-radius: 10px;
            margin-bottom: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .title { font-weight: 800; color: #fff; margin-bottom: 5px; font-size: 1em; }
        .author { font-size: 0.85em; opacity: 0.5; font-weight: 500; }

        .shimmer {
            height: 20px; background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 4px;
        }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        footer { text-align: center; padding: 80px 20px; opacity: 0.3; font-size: 0.75em; letter-spacing: 2px; }

        @media (max-width: 768px) {
            .ai-search-box { width: 55%; }
            .hero h1 { font-size: 2em; }
            .catalog { grid-template-columns: repeat(2, 1fr); gap: 15px; }
        }
    </style>
</head>
<body>

<header>
    <div class="nav-container">
        <div class="logo">ARCHIVE</div>
        <div class="ai-search-box">
            <input type="text" id="aiInput" class="ai-input" placeholder="Tanya AI (Enter)...">
            <div id="ai-bubble"></div>
        </div>
    </div>
</header>

<section class="hero">
    <h1>Digital Library</h1>
    <p>The smartest way to find your next favorite book.</p>
</section>

<div class="catalog" id="bookGrid"></div>

<footer>
    TERSNACKS.ID PROJECT • 2026 • AI INTEGRATED SYSTEM
</footer>

<script>
    // --- GANTI API KEY DI SINI ---
    const API_KEY = "PAKE_KEY_LO_DI_SINI"; 

    // DATA BUKU
    const books = [
        { title: "Indie Pop Revolution", author: "Hindia Fanbase", img: "https://images.unsplash.com/photo-1514525253361-bee8718a300a?w=400" },
        { title: "One OK Rock Story", author: "Taka Voice", img: "https://images.unsplash.com/photo-1493225255756-d9584f8606e9?w=400" },
        { title: "Accounting Expert", author: "Prof. Alvin", img: "https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=400" },
        { title: "The Art of Snacks", author: "Tersnacks Team", img: "https://images.unsplash.com/photo-1551288049-bbbda536ad79?w=400" },
        { title: "Cyberpunk Design", author: "Dev Mode", img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400" },
        { title: "Music Production", author: "Studio Vibes", img: "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=400" }
    ];

    // Tampilkan Buku
    const grid = document.getElementById('bookGrid');
    books.forEach(b => {
        grid.innerHTML += `
            <div class="book-card">
                <img src="${b.img}" class="cover" alt="${b.title}">
                <div class="title">${b.title}</div>
                <div class="author">${b.author}</div>
            </div>
        `;
    });

    // AI GEMINI ENGINE
    const input = document.getElementById('aiInput');
    const bubble = document.getElementById('ai-bubble');

    input.addEventListener('keypress', async (e) => {
        if(e.key === 'Enter') {
            const prompt = input.value;
            if(!prompt) return;

            bubble.style.display = 'block';
            bubble.innerHTML = '<div class="shimmer"></div><p style="font-size:0.8em; margin-top:10px;">Gemini sedang berpikir...</p>';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Kamu adalah ArchiveAI, asisten perpustakaan digital milik Alvin. Jawab dengan singkat, padat, dan keren: ${prompt}` }]}]
                    })
                });

                const data = await response.json();
                
                if(data.candidates && data.candidates[0].content.parts[0].text) {
                    const result = data.candidates[0].content.parts[0].text;
                    bubble.innerHTML = `<div style="color:var(--accent); font-weight:bold; margin-bottom:10px;">Archive AI:</div>${result}`;
                } else {
                    throw new Error("Respons gagal");
                }

            } catch (err) {
                console.error(err);
                bubble.innerHTML = `<span style="color:red;">Waduh Vin, stuck!</span><br><small>Cek console (F12) buat liat errornya.</small>`;
            }
        }
    });

    // Klik luar buat nutup bubble AI
    document.addEventListener('mousedown', (e) => {
        if(!e.target.closest('.ai-search-box')) bubble.style.display = 'none';
    });
</script>

</body>
</html>
