<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALAXY ARCHIVE // AUDIO VISUAL</title>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;900&display=swap" rel="stylesheet">

    <style>
        :root { --neon: #00f3ff; --bg: #000000; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* UI OVERLAY */
        .overlay { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 30px; pointer-events: none; }
        .logo { font-family: 'Syncopate'; font-weight: 700; font-size: 1.2rem; letter-spacing: 10px; color: var(--neon); text-shadow: 0 0 15px var(--neon); pointer-events: auto; }

        /* PLAYER HUD */
        .music-hud {
            position: fixed; top: 100px; right: 40px; text-align: right;
            pointer-events: auto; opacity: 0; transform: translateX(50px);
            transition: 0.8s ease;
        }
        .music-hud.active { opacity: 1; transform: translateX(0); }
        .track-info h2 { font-family: 'Syncopate'; font-size: 2.2rem; margin: 0; color: #fff; text-transform: uppercase; }
        .track-info p { color: var(--neon); letter-spacing: 5px; font-size: 0.7rem; margin-bottom: 20px; }
        
        .track-list { list-style: none; }
        .track-list li { 
            padding: 8px 0; font-size: 0.8rem; opacity: 0.6; cursor: pointer; 
            transition: 0.3s; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .track-list li:hover { opacity: 1; color: var(--neon); padding-right: 10px; }

        .controls { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; pointer-events: auto; z-index: 100; }
        .btn { 
            background: rgba(0,0,0,0.8); border: 1px solid var(--neon); padding: 12px 25px; 
            border-radius: 2px; color: white; cursor: pointer; backdrop-filter: blur(10px); 
            font-family: 'Syncopate'; font-size: 0.6rem; transition: 0.3s; letter-spacing: 2px;
        }
        .btn:hover { background: var(--neon); color: black; box-shadow: 0 0 20px var(--neon); }

        .loading-screen {
            position: fixed; inset: 0; background: black; z-index: 999;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Syncopate'; font-size: 0.8rem; letter-spacing: 5px;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

<div class="loading-screen" id="loader">INITIALIZING MULTIVERSE...</div>
<div id="canvas-container"></div>

<div class="overlay">
    <header><div class="logo">ALVIN.ARC</div></header>

    <div class="music-hud" id="musicHud">
        <div class="track-info">
            <p id="artist-tag">NOW ENTERING</p>
            <h2 id="current-galaxy">SYSTEM</h2>
        </div>
        <ul class="track-list" id="playlist"></ul>
    </div>

    <div class="controls">
        <div class="btn" onclick="travelTo('oor')">ONE OK ROCK GALAXY</div>
        <div class="btn" onclick="travelTo('indie')">INDIE SECTOR</div>
        <div class="btn" onclick="travelTo('home')">HOME</div>
    </div>
</div>

<script>
    let scene, camera, renderer, controls, starField;
    const systems = {};
    const loader = new THREE.TextureLoader();

    // Data Galaksi
    const data = {
        oor: {
            name: "ONE OK ROCK",
            tag: "ALTERNATIVE ROCK",
            color: 0xff1111,
            pos: { x: -80, y: 0, z: -50 },
            img: "https://i.ibb.co/L8y6y6n/oor-placeholder.jpg", // Gantilah link ini kalau ada foto OOR lo
            tracks: ["The Beginning", "Vandalize", "Save Yourself", "Wherever You Are"]
        },
        indie: {
            name: "INDIE VIBE",
            tag: "HINDIA & IDGITAF",
            color: 0x00f3ff,
            pos: { x: 80, y: 15, z: -80 },
            img: "https://i.ibb.co/m0fHkG4/indie-placeholder.jpg",
            tracks: ["Satu-Satu", "Evaluasi", "Rumah ke Rumah", "Takut"]
        }
    };

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 3000);
        camera.position.set(0, 50, 200);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 1. Create Starfield Background
        const starGeo = new THREE.BufferGeometry();
        const starPositions = [];
        for(let i=0; i<20000; i++) starPositions.push((Math.random()-0.5)*2500, (Math.random()-0.5)*2500, (Math.random()-0.5)*2500);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
        starField = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.6 }));
        scene.add(starField);

        // 2. Create Galaxies & Holograms
        Object.keys(data).forEach(key => {
            const config = data[key];
            const group = new THREE.Group();
            
            // Galaxy Particles
            const pCount = 12000;
            const pGeo = new THREE.BufferGeometry();
            const pPos = [];
            for (let i = 0; i < pCount; i++) {
                const r = Math.random() * 35;
                const theta = Math.random() * Math.PI * 2;
                const spiral = r * 0.4;
                pPos.push(Math.cos(theta+spiral)*r, (Math.random()-0.5)*5, Math.sin(theta+spiral)*r);
            }
            pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
            const points = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: config.color, size: 0.1, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending }));
            group.add(points);

            // Hologram Plane (Siluet Artist)
            const planeGeo = new THREE.PlaneGeometry(15, 15);
            const planeMat = new THREE.MeshBasicMaterial({ 
                color: config.color, 
                transparent: true, 
                opacity: 0.3, 
                side: THREE.DoubleSide,
                wireframe: true // Efek hologram digital
            });
            const hologram = new THREE.Mesh(planeGeo, planeMat);
            hologram.position.y = 5;
            group.add(hologram);

            group.position.set(config.pos.x, config.pos.y, config.pos.z);
            systems[key] = group;
            scene.add(group);
        });

        // Lights
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        document.getElementById('loader').style.opacity = '0';
        setTimeout(() => document.getElementById('loader').remove(), 1000);

        animate();
    }

    function travelTo(target) {
        const hud = document.getElementById('musicHud');
        const list = document.getElementById('playlist');

        if(target === 'home') {
            gsap.to(camera.position, { x: 0, y: 50, z: 200, duration: 2.5, ease: "power2.inOut" });
            gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 2 });
            hud.classList.remove('active');
            return;
        }

        const info = data[target];
        const targetPos = systems[target].position;

        // Zoom Camera
        gsap.to(camera.position, { x: targetPos.x, y: targetPos.y + 10, z: targetPos.z + 50, duration: 2.5, ease: "expo.inOut" });
        gsap.to(controls.target, { x: targetPos.x, y: targetPos.y, z: targetPos.z, duration: 2.5 });

        // Update UI
        document.getElementById('current-galaxy').innerText = info.name;
        document.getElementById('current-galaxy').style.color = `#${info.color.toString(16)}`;
        document.getElementById('artist-tag').innerText = info.tag;
        list.innerHTML = "";
        info.tracks.forEach(t => list.innerHTML += `<li>▶ ${t}</li>`);
        hud.classList.add('active');
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        
        // Rotasi Galaksi
        Object.values(systems).forEach(s => s.rotation.y += 0.002);
        starField.rotation.y += 0.0002;

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>
</body>
</html>
