<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SNACK BOOK - TERSNACKS.ID</title>
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            perspective: 1500px; /* Efek 3D Kedalaman */
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .book {
            width: 350px;
            height: 500px;
            position: relative;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }

        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: #111;
            border: 1px solid #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
            transform-origin: left;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 0 15px 15px 0;
        }

        /* Halaman Depan / Cover */
        .page.front {
            z-index: 2;
            background: linear-gradient(45deg, #0a1929, #000);
            border-left: 5px solid #00d4ff;
        }

        /* Konten dalam buku */
        .content {
            text-align: center;
            backface-visibility: hidden;
        }

        .snack-img {
            width: 80%;
            border-radius: 10px;
            border: 2px solid #00d4ff;
            margin-bottom: 15px;
        }

        /* Efek Membalik Halaman */
        .page.flipped {
            transform: rotateY(-160deg);
            z-index: 1;
        }

        .instruction {
            position: fixed;
            bottom: 20px;
            color: #00d4ff;
            font-size: 0.8em;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="book" id="snackBook">
    <div class="page" id="p3">
        <div class="content">
            <h2 style="color: #00d4ff;">MENU BARU</h2>
            <img src="https://i.postimg.cc/gjYGV4z5/601de701-a9b5-4bbf-8aa6-87b171349a64.jpg" class="snack-img">
            <p style="font-weight: 900;">BASRENG PEDAS</p>
            <button style="background:#00d4ff; border:none; padding:10px 20px; border-radius:10px; font-weight:900;">ORDER NOW</button>
        </div>
    </div>

    <div class="page" id="p2" onclick="flipPage('p2')">
        <div class="content">
            <h2 style="color: #00d4ff;">BEST SELLER</h2>
            <img src="https://i.postimg.cc/MZbTnf6L/184f7bee-21ba-4477-81c6-c9f7acfb487a.jpg" class="snack-img">
            <p style="font-weight: 900;">KACANG TOJIN</p>
            <p style="font-size: 0.8em;">Garing, Gurih, Premium.</p>
        </div>
    </div>

    <div class="page front" id="p1" onclick="flipPage('p1')">
        <div class="content">
            <img src="https://i.postimg.cc/T3Dj51gC/download.png" style="width: 150px; filter: drop-shadow(0 0 10px #00d4ff);">
            <h1 style="letter-spacing: 5px; margin-top: 20px;">THE SNACK BOOK</h1>
            <p style="color: #00d4ff; font-weight: 900;">PREMIUM QUALITY</p>
        </div>
    </div>
</div>

<div class="instruction">TAP TO OPEN THE BOOK</div>

<script>
    function flipPage(pageId) {
        const page = document.getElementById(pageId);
        page.classList.toggle('flipped');
    }
</script>

</body>
</html>
