<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARCHIVE | DIGITAL LIBRARY</title>
    <style>
        :root {
            --accent: #00d4ff;
            --bg: #0a1929;
            --glass: rgba(15, 34, 56, 0.9);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; background: var(--bg); color: white;
            overflow-x: hidden;
        }

        /* HEADER & AI NAV */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: var(--glass); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            padding: 15px 0;
        }

        .nav-container {
            max-width: 1200px; margin: 0 auto; display: flex;
            justify-content: space-between; align-items: center; padding: 0 20px;
        }

        .logo { font-weight: 900; letter-spacing: 2px; color: var(--accent); font-size: 1.2em; }

        .ai-search-box {
            position: relative; width: 45%;
        }

        .ai-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(0, 212, 255, 0.5);
            padding: 10px 20px; border-radius: 30px; color: white; outline: none;
            transition: 0.3s;
        }

        .ai-input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); }

        #ai-bubble {
            position: absolute; top: 55px; left: 0; width: 100%;
            background: #162a41; border: 1px solid var(--accent);
            border-radius: 15px; padding: 15px; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-size: 0.9em;
        }

        /* HERO SECTION */
        .hero {
            padding: 150px 20px 60px; text-align: center;
            background: radial-gradient(circle at top, rgba(0,212,255,0.1) 0%, transparent 70%);
        }

        /* BOOK GRID */
        .catalog {
            max-width: 1100px; margin: 0 auto; padding: 40px 20px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .book-card {
            background: rgba(255,255,255,0.03); border-radius: 12px; padding: 15px;
            border: 1px solid rgba(255,255,255,0.1); transition: 0.3s;
        }

        .book-card:hover { transform: translateY(-10px); border-color: var(--accent); }

        .cover {
            width: 100%; height: 280px; object-fit: cover; border-radius: 8px;
            margin-bottom: 12px;
        }

        .title { font-weight: 700; color: var(--accent); margin-bottom: 5px; }
