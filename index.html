<!封装 html>
<html ⚡ lang="id">
<head>
    <meta charset="utf-8">
    <title>Tersnacks - Review Pelanggan</title>
    <link rel="canonical" href="https://tersnacks.pages.dev">
    <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
    
    <script async src="https://cdn.ampproject.org/v0.js"></script>
    <script async custom-element="amp-carousel" src="https://cdn.ampproject.org/v0/amp-carousel-0.1.js"></script>

    <style amp-custom>
        body {
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* Container Review */
        .review-section {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }

        h2 {
            color: #ffc107;
            font-size: 1.2em;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Style Carousel */
        .review-card {
            width: 200px;
            height: 250px;
            background: #fff;
            color: #333;
            border-radius: 10px;
            margin: 0 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .review-img {
            object-fit: cover;
        }

        .review-text {
            padding: 10px;
            font-size: 0.8em;
            font-style: italic;
            line-height: 1.2;
        }

        .reviewer-name {
            font-weight: bold;
            color: #ff4500;
            display: block;
            margin-top: 5px;
        }
    </style>

    <style amp-boilerplate>body{-webkit-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-moz-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-ms-animation:-amp-start 8s steps(1,end) 0s 1 normal both;animation:-amp-start 8s steps(1,end) 0s 1 normal both}@-webkit-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-moz-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-ms-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-o-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}</style><noscript><style amp-boilerplate>body{-webkit-animation:none;-moz-animation:none;-ms-animation:none;animation:none}</style></noscript>
</head>
<body>

    <div class="review-section">
        <h2>⭐ Kata Mereka</h2>
        
        <amp-carousel height="280" layout="fixed-height" type="slides" role="region" aria-label="Review Pelanggan">
            
            <div class="review-card">
                <amp-img src="https://i.postimg.cc/MZbTnf6L/184f7bee-21ba-4477-81c6-c9f7acfb487a.jpg" 
                    width="200" height="150" layout="responsive" class="review-img" alt="Review 1"></amp-img>
                <div class="review-text">
                    "Kacang Tojin-nya renyah bgt, bumbunya berasa sampe ke dalem!"
                    <span class="reviewer-name">- Andi, Jakarta</span>
                </div>
            </div>

            <div class="review-card">
                <amp-img src="https://i.postimg.cc/ncFLBVMD/b95988fe-979d-48c6-891c-900e8f3e42f1.jpg" 
                    width="200" height="150" layout="responsive" class="review-img" alt="Review 2"></amp-img>
                <div class="review-text">
                    "Baru kali ini beli snack online tapi kualitas premium. Mantap!"
                    <span class="reviewer-name">- Budi, Bandung</span>
                </div>
            </div>

            <div class="review-card">
                <amp-img src="https://i.postimg.cc/gjYGV4z5/601de701-a9b5-4bbf-8aa6-87b171349a64.jpg" 
                    width="200" height="150" layout="responsive" class="review-img" alt="Review 3"></amp-img>
                <div class="review-text">
                    "Basrengnya pedes nampol, gak keras sama sekali. Recomended!"
                    <span class="reviewer-name">- Siska, Medan</span>
                </div>
            </div>

        </amp-carousel>
    </div>

</body>
</html>
