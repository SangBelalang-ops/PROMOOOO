<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETOX AAA // THE TITAN ENGINE</title>
    <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff0000; --glow: rgba(255, 0, 0, 0.6); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Space Mono', monospace; overflow: hidden; }
        
        /* CINEMATIC HUD */
        #ui-hud { position: fixed; inset: 0; pointer-events: none; z-index: 100; border: 1px solid rgba(255,0,0,0.1); }
        .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 150px rgba(0,0,0,1); }
        .crosshair { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%); }
        .crosshair::before { content: ''; position: absolute; top: 50%; width: 100%; height: 1px; background: var(--accent); opacity: 0.5; }
        .crosshair::after { content: ''; position: absolute; left: 50%; height: 100%; width: 1px; background: var(--accent); opacity: 0.5; }

        #data-stream { position: absolute; bottom: 40px; left: 40px; border-left: 2px solid var(--accent); padding-left: 15px; }
        .glitch-text { font-family: 'Syncopate'; font-size: 0.7rem; letter-spacing: 5px; color: var(--accent); animation: flicker 0.1s infinite; }
        
        #overlay { position: fixed; inset: 0; z-index: 1000; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        
        @keyframes flicker { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.9; } }
    </style>
</head>
<body>

<div id="ui-hud">
    <div class="vignette"></div>
    <div class="crosshair"></div>
    <div id="data-stream">
        <div class="glitch-text">TITAN_ENGINE_V6.0</div>
        <p style="font-size: 0.5rem; opacity: 0.4;">RENDER_MODE: AAA_ULTRA // PBR_SHADERS: ACTIVE</p>
    </div>
</div>

<div id="overlay" onclick="bootEngine()">
    <h1 style="font-family:'Syncopate'; letter-spacing: 20px; text-shadow: 0 0 30px var(--accent);">DETOX</h1>
    <p style="margin-top: 20px; font-size: 0.6rem; opacity: 0.3; letter-spacing: 5px;">[ CLICK TO DEPLOY AAA ENVIRONMENT ]</p>
</div>

<audio id="bgm" src="chaosmyth.mp3" loop></audio>

<script>
    let scene, camera, renderer, clock, blocks;
    const audio = document.getElementById('bgm');

    function bootEngine() {
        gsap.to("#overlay", { opacity: 0, duration: 2, ease: "power4.inOut", onComplete: () => {
            document.getElementById('overlay').style.display = 'none';
            init();
            animate();
            audio.play();
        }});
    }

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.02); // Cinematic depth fog

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 15, 20);

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping; // AAA color grading
        renderer.toneMappingExposure = 2.5;
        document.body.appendChild(renderer.domElement);

        // AAA LIGHTING: ORBITAL SETUP
        const mainLight = new THREE.PointLight(0xff0000, 10, 100);
        mainLight.position.set(0, 20, 0);
        scene.add(mainLight);

        const blueRim = new THREE.SpotLight(0x00f3ff, 50);
        blueRim.position.set(-30, 20, -30);
        scene.add(blueRim);

        scene.add(new THREE.AmbientLight(0x111111));

        // INSTANCED VOXEL ENGINE (Performance & Detail)
        const count = 2500;
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({
            color: 0x080808,
            metalness: 0.9,
            roughness: 0.1,
            emissive: 0xff0000,
            emissiveIntensity: 0.5
        });

        blocks = new THREE.InstancedMesh(geometry, material, count);
        const matrix = new THREE.Matrix4();
        let i = 0;
        for (let x = -25; x < 25; x++) {
            for (let z = -25; z < 25; z++) {
                // Procedural Terrain Level Dewa
                const h = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 5;
                matrix.setPosition(x * 1.05, h, z * 1.05);
                blocks.setMatrixAt(i++, matrix);
            }
        }
        scene.add(blocks);

        clock = new THREE.Clock();

        // CONTROLS: SMOOTH CINEMATIC ORBIT
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        // Cinematic Camera Move
        camera.position.x = Math.cos(t * 0.1) * 35;
        camera.position.z = Math.sin(t * 0.1) * 35;
        camera.lookAt(0, 0, 0);

        // Dynamic Glow Reaction
        blocks.material.emissiveIntensity = Math.abs(Math.sin(t)) * 1.5;

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
