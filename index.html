<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETOX // VOXEL BREAKER</title>
    <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff0000; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Space Mono', monospace; overflow: hidden; }
        
        #crosshair { position: fixed; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); z-index: 100; pointer-events: none; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: var(--accent); opacity: 0.8; }
        #crosshair::before { top: 50%; left: 0; width: 100%; height: 2px; }
        #crosshair::after { top: 0; left: 50%; width: 2px; height: 100%; }

        #hud { position: fixed; bottom: 40px; left: 40px; z-index: 50; border-left: 3px solid var(--accent); padding-left: 20px; text-shadow: 0 0 10px var(--accent); }
        #msg { position: fixed; top: 40px; width: 100%; text-align: center; font-family: 'Syncopate'; font-size: 0.7rem; letter-spacing: 5px; opacity: 0.5; }
        
        #overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        .glitch { font-family: 'Syncopate'; font-size: 2rem; letter-spacing: 15px; color: #fff; position: relative; }
        .glitch::after { content: 'DETOX-X'; position: absolute; left: 2px; text-shadow: -2px 0 red; background: black; overflow: hidden; clip: rect(0,900px,0,0); animation: noise 2s infinite linear alternate-reverse; }

        @keyframes noise { 0% { clip: rect(10px, 999px, 40px, 0); } 100% { clip: rect(80px, 999px, 90px, 0); } }
    </style>
</head>
<body>

<div id="msg">LEFT CLICK: DESTROY | RIGHT CLICK: BUILD | ESC: UNLOCK</div>
<div id="crosshair"></div>
<div id="hud">
    <h2 style="font-family:'Syncopate'; font-size: 1rem;">VOXEL CORE V5</h2>
    <p id="coords">X: 0 Y: 0 Z: 0</p>
</div>

<div id="overlay" onclick="start()">
    <div class="glitch">DETOX-X</div>
    <p style="margin-top: 20px; font-size: 0.6rem; opacity: 0.4;">CLICK TO INITIALIZE WORLD</p>
</div>

<audio id="bgm" src="chaosmyth.mp3" loop></audio>

<script>
    let scene, camera, renderer, controls, raycaster, mouse;
    let voxels = [];
    const audio = document.getElementById('bgm');

    function start() {
        document.getElementById('overlay').style.display = 'none';
        audio.play();
        init();
        animate();
    }

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020202);
        scene.fog = new THREE.FogExp2(0x020202, 0.03);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        // LIGHTS (High Contrast)
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x202020));

        // GENERATE WORLD
        const geo = new THREE.BoxGeometry(1, 1, 1);
        for(let x = -10; x < 10; x++) {
            for(let z = -10; z < 10; z++) {
                createVoxel(x, 0, z);
            }
        }

        // CUSTOM POINTER LOCK
        document.addEventListener('mousedown', onMouseDown);
        window.addEventListener('resize', onResize);
    }

    function createVoxel(x, y, z) {
        const mat = new THREE.MeshStandardMaterial({ 
            color: 0x111111, 
            metalness: 0.9, 
            roughness: 0.1,
            emissive: 0xff0000,
            emissiveIntensity: 0.1
        });
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
        mesh.position.set(x, y, z);
        scene.add(mesh);
        voxels.push(mesh);
    }

    function onMouseDown(e) {
        // Raycasting Logic
        mouse.x = 0; // Center screen
        mouse.y = 0;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(voxels);

        if (intersects.length > 0) {
            const intersect = intersects[0];
            if (e.button === 0) { // Left Click: Hancurin
                scene.remove(intersect.object);
                voxels = voxels.filter(v => v !== intersect.object);
            } else if (e.button === 2) { // Right Click: Bangun
                const pos = intersect.object.position.clone().add(intersect.face.normal);
                createVoxel(pos.x, pos.y, pos.z);
            }
        }
    }

    // Disable Right-Click Menu
    window.oncontextmenu = (e) => e.preventDefault();

    function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Gerakan Camera (Orbit basic buat testing)
    let angle = 0;
    function animate() {
        requestAnimationFrame(animate);
        
        // Bikin kamera melayang estetik
        angle += 0.005;
        camera.position.x = Math.cos(angle) * 15;
        camera.position.z = Math.sin(angle) * 15;
        camera.lookAt(0, 0, 0);

        document.getElementById('coords').innerText = `X: ${camera.position.x.toFixed(2)} Y: ${camera.position.y.toFixed(2)} Z: ${camera.position.z.toFixed(2)}`;
        
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
