<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CYBER ARCHIVE // ALVIN P.</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/typed.js@2.0.16/dist/typed.umd.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon: #00d4ff;
            --bg: #020617;
            --card: rgba(15, 23, 42, 0.5);
            --font-main: 'Space Grotesk', sans-serif;
        }

        body {
            font-family: var(--font-main);
            margin: 0; background: var(--bg); color: white;
            overflow-x: hidden; scroll-behavior: smooth;
        }

        /* --- 1. BACKGROUND GRID BERGERAK --- */
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0,212,255,0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,212,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px; background-position: center;
            z-index: -1; transform: perspective(500px) rotateX(60deg);
            animation: gridMove 20s linear infinite; opacity: 0.5;
        }
        @keyframes gridMove { from { background-position: 0 0; } to { background-position: 0 1000px; } }

        /* --- 2. CURSOR GLOW (DIALIRKAN LEWAT JS) --- */
        #glow {
            position: fixed; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(0,212,255,0.15) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%); transition: 0.05s linear;
        }

        /* --- 3. HEADER MODERN GLOW --- */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            padding: 10px 0;
        }
        .nav-container {
            max-width: 1400px; margin: 0 auto; display: flex;
            justify-content: space-between; align-items: center; padding: 0 30px;
        }
        .logo { font-weight: 700; letter-spacing: 4px; color: #fff; font-size: 1.4em; }
        .logo span { color: var(--neon); text-shadow: 0 0 10px var(--neon); }

        .ai-wrapper { position: relative; width: 35%; }
        .ai-input {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 10px 20px; border-radius: 50px; color: white; outline: none; transition: 0.3s;
        }
        .ai-input:focus { border-color: var(--neon); box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); }

        #ai-bubble {
            position: absolute; top: 55px; left: 0; width: 100%;
            background: #0f172a; border: 1px solid var(--neon);
            border-radius: 12px; padding: 15px; display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* --- 4. HERO SECTION WITH TYPED.JS --- */
        .hero {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 0 20px; position: relative;
        }
        .hero h1 { font-size: 6em; font-weight: 700; margin: 0; letter-spacing: -4px; opacity: 0; }
        .hero p { font-size: 1.5em; opacity: 0.7; margin-top: 10px; font-weight: 300; }
        
        /* Typed.js Cursor Color */
        .typed-cursor { color: var(--neon); }

        /* Scroll Down Indicator */
        .scroll-down {
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            opacity: 0.5; animation: bounce 2s infinite; cursor: pointer;
        }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0) translateX(-50%);} 40% {transform: translateY(-10px) translateX(-50%);} 60% {transform: translateY(-5px) translateX(-50%);} }

        /* --- 5. CONTENT SECTION WITH SCROLLTRIGGER --- */
        .content-section {
            padding: 100px 20px; max-width: 1200px; margin: 0 auto;
        }
        .section-title {
            font-size: 3em; font-weight: 700; letter-spacing: -2px;
            margin-bottom: 50px; display: inline-block; position: relative;
        }
        .section-title::after {
            content: ''; position: absolute; bottom: -10px; left: 0; width: 0; height: 3px;
            background: var(--neon); transition: 0.5s ease;
        }
        .section-title.active::after { width: 100%; }

        /* MUSIC EP CARD */
        .music-card {
            background: var(--card); border-radius: 20px; padding: 30px;
            border: 1px solid rgba(255,255,255,0.03);
            display: flex; align-items: center; gap: 30px; margin-bottom: 80px;
            opacity: 0; transform: translateY(50px);
        }
        .art { width: 180px; height: 180px; background: #1e293b; border-radius: 12px; flex-shrink: 0; }

        /* CATALOG GRID */
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
        }
        .card {
            background: var(--card); border-radius: 15px; padding: 20px;
            border: 1px solid rgba(255,255,255,0.03); cursor: pointer;
            opacity: 0; transform: translateY(50px);
        }
        .cover { width: 100%; height: 300px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; }
        
        /* LOADING SHIMMER */
        .shimmer { height: 15px; background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: load 1.5s infinite; }
        @keyframes load { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        footer { text-align: center; padding: 100px; opacity: 0.2; font-size: 0.8em; letter-spacing: 5px; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 3.5em; }
            .music-card { flex-direction: column; text-align: center; }
            .ai-wrapper { width: 90%; margin-top: 10px; }
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>
<div id="glow"></div>

<header>
    <div class="nav-container">
        <div class="logo">ALVIN<span>.ARC</span></div>
        <div class="ai-wrapper">
            <input type="text" id="aiInput" class="ai-input" placeholder="Tanya Archive AI (Enter)...">
            <div id="ai-bubble"></div>
        </div>
    </div>
</header>

<section class="hero" id="hero">
    <h1 id="hero-title">THE CYBER ARCHIVE</h1>
    <p>
        <span id="typed-text"></span>
    </p>
    <div class="scroll-down" onclick="gsap.to(window, {duration: 1, scrollTo: '#content'})">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
    </div>
</section>

<section class="content-section" id="content">
    <h2 class="section-title">FEATURED RELEASE</h2>
    
    <div class="music-card" id="musicCard">
        <div class="art"><img src="https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=400" style="width:100%; border-radius:12px;"></div>
        <div style="text-align: left;">
            <div style="color: var(--neon); font-weight: 700; font-size: 0.9em; letter-spacing: 1px;">MINI ALBUM (2026)</div>
            <h3 style="font-size: 2.5em; margin: 10px 0; font-weight: 700; letter-spacing: -1px;">Indie Pop Aesthetics</h3>
            <p style="opacity: 0.6; font-size: 1.1em; font-weight: 300;">Exploration of sound, nostalgia, and digital culture. Produced & Mixed by Alvin P.</p>
        </div>
    </div>

    <h2 class="section-title">LIBRARY ARCHIVE</h2>
    <div class="grid" id="mainGrid">
        </div>
</section>

<footer>A. PHANESTU // DIGITAL ARCHIVE // EST. 2026</footer>

<script>
    // --- 1. KONFIGURASI GSAP & SCROLLTRIGGER ---
    gsap.registerPlugin(ScrollTrigger);

    // Animasi Masuk Hero
    const tl = gsap.timeline({defaults: {ease: "power4.out"}});
    tl.to("#hero-title", {opacity: 1, y: 0, duration: 1.5, delay: 0.5})
      .from("header", {y: -100, opacity: 0, duration: 1}, "-=1");

    // Efek Ketikan Typed.js
    new Typed('#typed-text', {
        strings: ['Alvin Phanestu // Indie-Pop Producer', 'Archive Specialist', 'Digital Visionary'],
        typeSpeed: 60, backSpeed: 30, backDelay: 2000, loop: true
    });

    // Animasi Scroll Section Title (Garis Bawah)
    gsap.utils.toArray(".section-title").forEach(title => {
        ScrollTrigger.create({
            trigger: title, start: "top 80%",
            onEnter: () => title.classList.add("active")
        });
    });

    // Animasi Scroll Music Card
    gsap.to("#musicCard", {
        scrollTrigger: { trigger: "#musicCard", start: "top 85%" },
        opacity: 1, y: 0, duration: 1, ease: "power2.out"
    });

    // --- 2. RENDER CATALOG DENGAN ANIMASI GSAP STAGGER ---
    const libraryData = [
        { title: "One OK Rock Collection", auth: "Fan Archives", img: "https://images.unsplash.com/photo-1493225255756-d9584f8606e9?w=400" },
        { title: "Accounting Logs 2018", auth: "Admin Data", img: "https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=400" },
        { title: "Indie Pop Aesthetics", auth: "Studio Vibes", img: "https://images.unsplash.com/photo-1514525253361-bee8718a300a?w=400" },
        { title: "Tersnacks Hub", auth: "Digital Snacks", img: "https://images.unsplash.com/photo-1551288049-bbbda536ad79?w=400" }
    ];

    const grid = document.getElementById('mainGrid');
    libraryData.forEach(item => {
        grid.innerHTML += `
            <div class="card catalog-item">
                <img src="${item.img}" class="cover">
                <div style="font-weight:700; color:var(--neon); font-size:1.1em">${item.title}</div>
                <div style="font-size:0.85em; opacity:0.5; text-transform:uppercase">${item.auth}</div>
            </div>
        `;
    });

    // Animasi Scroll Catalog Grid (Stagger effect)
    gsap.to(".catalog-item", {
        scrollTrigger: { trigger: ".grid", start: "top 85%" },
        opacity: 1, y: 0, duration: 0.8, stagger: 0.2, ease: "power2.out"
    });

    // --- 3. FITUR TAMBAHAN CANGGIH ---
    // Cursor Glow
    const glow = document.getElementById('glow');
    document.addEventListener('mousemove', (e) => {
        glow.style.left = e.clientX + 'px';
        glow.style.top = e.clientY + 'px';
    });

    // AI Simulasi (Visual)
    const aiInput = document.getElementById('aiInput');
    const aiBubble = document.getElementById('ai-bubble');

    aiInput.addEventListener('keypress', async (e) => {
        if(e.key === 'Enter') {
            const prompt = aiInput.value;
            if(!prompt) return;
            aiBubble.style.display = 'block';
            aiBubble.innerHTML = '<div class="shimmer"></div>';
            setTimeout(() => {
                aiBubble.innerHTML = `<b style="color:var(--neon)">ArchiveAI:</b><br>Halo Alvin! Keren pertanyaannya: "${prompt}". Karena API Key lo belum dipasang di versi ini, gue cuma bisa simulasi visual doang. Tapi visual webnya udah canggih kan? Pasang Key-nya biar gue beneran pinter!`;
            }, 1800);
        }
    });

    document.addEventListener('mousedown', (e) => { if(!e.target.closest('.ai-wrapper')) aiBubble.style.display = 'none'; });
</script>
</body>
</html>
