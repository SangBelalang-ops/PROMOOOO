<!DOCTYPE html><html lang="en"><head><style>body{margin:0;overflow:hidden;background:#000}</style></head><body>
<script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
<script>
const s=new THREE.Scene(),c=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(window.innerWidth,window.innerHeight);
r.toneMapping=THREE.ReinhardToneMapping;r.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(r.domElement);
const g=new THREE.BoxGeometry(1,1,1),m=new THREE.MeshStandardMaterial({color:0x050505,metalness:1,roughness:0});
const inst=new THREE.InstancedMesh(g,m,2000);const mat=new THREE.Matrix4();
for(let i=0;i<2000;i++){
    let x=(Math.random()-0.5)*40,y=(Math.random()-0.5)*40,z=(Math.random()-0.5)*40;
    mat.setPosition(x,y,z);inst.setMatrixAt(i,mat);
}s.add(inst);
const l1=new THREE.PointLight(0xff0000,100,50);l1.position.set(10,10,10);s.add(l1);
const l2=new THREE.PointLight(0x00f3ff,100,50);l2.position.set(-10,-10,-10);s.add(l2);
s.fog=new THREE.FogExp2(0x000000,0.05);
const shm=`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
const shf=`varying vec2 vUv;uniform float t;void main(){
    vec3 col=0.5+0.5*cos(t+vUv.xyx+vec3(0,2,4));gl_FragColor=vec4(col*0.2,1.0);}`;
const bgG=new THREE.SphereGeometry(100,32,32),bgM=new THREE.ShaderMaterial({
    uniforms:{t:{value:0}},vertexShader:shm,fragmentShader:shf,side:THREE.BackSide});
const bg=new THREE.Mesh(bgG,bgM);s.add(bg);
function animate(t){
    requestAnimationFrame(animate);const time=t*0.001;
    inst.rotation.x=time*0.1;inst.rotation.y=time*0.15;
    bgM.uniforms.t.value=time;
    c.position.z=25+Math.sin(time)*5;c.lookAt(0,0,0);
    l1.position.x=Math.sin(time)*15;l1.position.z=Math.cos(time)*15;
    r.render(s,c);
}animate();
window.onresize=()=>{c.aspect=window.innerWidth/window.innerHeight;c.updateProjectionMatrix();r.setSize(window.innerWidth,window.innerHeight)};
// TITAN-100 ENGINE DEPLOYED. NO LAG. NO BURIK. ONLY AAA VIBE.
</script></body></html>
